<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mein Helfer – Sprachassistent</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-size: 1.25rem; }
    </style>
</head>
<body class="bg-slate-100 text-slate-900 min-h-screen flex flex-col justify-between">

    <!-- Kopfbereich -->
    <header class="bg-blue-700 text-white p-6 text-center shadow-md relative">
        <h1 class="text-3xl font-bold">Mein Alltags-Helfer</h1>
        <p class="text-lg text-blue-100 mt-1">Sprechen Sie einfach mit der App</p>
        <button onclick="toggleSettings()" class="absolute top-4 right-4 bg-blue-800 hover:bg-blue-900 text-white px-3 py-1 rounded-lg text-sm">
            ⚙️ Schlüssel & Test
        </button>
    </header>

    <!-- Einstellungs-Box -->
    <div id="settingsBox" class="hidden bg-amber-50 border-b border-amber-200 p-4 shadow-inner">
        <div class="container mx-auto max-w-md">
            <label class="block text-sm font-bold text-amber-900 mb-1">OpenAI API-Key (sk-...):</label>
            <div class="flex gap-2 mb-2">
                <input type="password" id="apiKeyInput" placeholder="sk-..." class="flex-grow p-2 border border-amber-300 rounded-lg text-base">
                <button onclick="saveApiKey()" class="bg-amber-600 hover:bg-amber-700 text-white px-4 py-2 rounded-lg text-base font-semibold">Speichern</button>
            </div>
            <button onclick="checkOpenAIConnection()" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-2 rounded-lg text-sm font-medium">
                🔍 Verbindung prüfen
            </button>
            <p id="connectionStatus" class="text-xs text-amber-800 mt-2 font-medium"></p>
        </div>
    </div>

    <!-- Hauptbereich -->
    <main class="container mx-auto p-4 max-w-md flex-grow flex flex-col justify-center space-y-6">

        <!-- Großer Mikrofon-Button -->
        <div class="flex flex-col items-center">
            <button id="recordBtn" onclick="toggleSpeechRecognition()" class="w-40 h-40 bg-red-600 hover:bg-red-700 text-white rounded-full flex flex-col items-center justify-center shadow-2xl transition transform active:scale-95 border-4 border-white cursor-pointer">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-20 w-20 mb-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z" />
                </svg>
                <span id="recordText" class="text-sm font-semibold tracking-wide">SPRECHEN</span>
            </button>
            <p id="statusMessage" class="mt-4 text-center font-medium text-slate-700 h-8">Drücken und sprechen...</p>
        </div>

        <!-- Ergebnis-Box -->
        <div class="bg-white p-5 rounded-2xl shadow-md border border-slate-200">
            <h2 class="text-xl font-bold text-blue-800 mb-2">Erkannter Befehl / KI-Antwort:</h2>
            <p id="outputBox" class="text-slate-600 italic">Noch nichts eingegeben...</p>
        </div>

        <!-- Gespeicherte Einträge -->
        <div class="bg-white p-5 rounded-2xl shadow-md border border-slate-200">
            <h2 class="text-xl font-bold text-blue-800 mb-3">Das Wichtigste für heute:</h2>
            <ul id="entryList" class="space-y-2 text-lg">
                <li class="text-slate-500">Keine Einträge vorhanden.</li>
            </ul>
        </div>

    </main>

    <!-- Fußbereich -->
    <footer class="bg-slate-200 text-center p-4 text-sm text-slate-600">
        Einfach bedienbare Web-App für den Alltag
    </footer>

    <!-- JavaScript -->
    <script>
        const recordBtn = document.getElementById('recordBtn');
        const recordText = document.getElementById('recordText');
        const statusMessage = document.getElementById('statusMessage');
        const outputBox = document.getElementById('outputBox');
        const entryList = document.getElementById('entryList');
        const settingsBox = document.getElementById('settingsBox');
        const apiKeyInput = document.getElementById('apiKeyInput');
        const connectionStatus = document.getElementById('connectionStatus');

        let entries = JSON.parse(localStorage.getItem('openai_helfer_entries')) || [];
        renderEntries();

        const savedKey = localStorage.getItem('openai_user_api_key');
        if (savedKey) {
            apiKeyInput.value = savedKey;
        }

        function toggleSettings() {
            settingsBox.classList.toggle('hidden');
        }

        function saveApiKey() {
            const key = apiKeyInput.value.trim();
            if (key) {
                localStorage.setItem('openai_user_api_key', key);
                connectionStatus.textContent = "Schlüssel gespeichert. Teste Verbindung...";
                checkOpenAIConnection();
            } else {
                alert('Bitte gib einen gültigen Schlüssel ein.');
            }
        }

        // Verbindung zu OpenAI prüfen
        async function checkOpenAIConnection() {
            const key = localStorage.getItem('openai_user_api_key');
            if (!key) {
                connectionStatus.textContent = "⚠️ Kein Schlüssel hinterlegt.";
                return;
            }

            connectionStatus.textContent = "Prüfe Verbindung zu OpenAI...";
            try {
                const response = await fetch('https://api.openai.com/v1/models', {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${key}`
                    }
                });

                if (response.ok) {
                    connectionStatus.textContent = `✅ Verbindung erfolgreich! (Modell: gpt-4o-mini)`;
                } else {
                    connectionStatus.textContent = "❌ Fehler: Ungültiger API-Key.";
                }
            } catch (error) {
                connectionStatus.textContent = "❌ Netzwerkfehler beim Prüfen.";
                console.error(error);
            }
        }

        // Web Speech API Steuerung
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition = null;
        let isRecording = false;

        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.lang = 'de-DE';
            recognition.interimResults = false;
            recognition.maxAlternatives = 1;

            recognition.onstart = function() {
                isRecording = true;
                statusMessage.textContent = "Höre zu... Bitte sprechen.";
                recordBtn.classList.remove('bg-red-600', 'hover:bg-red-700');
                recordBtn.classList.add('bg-emerald-600', 'hover:bg-emerald-700', 'animate-pulse');
                recordText.textContent = "HÖRE...";
            };

            recognition.onresult = function(event) {
                const speechResult = event.results[0][0].transcript;
                outputBox.textContent = `"${speechResult}"`;
                sendToOpenAI(speechResult);
            };

            recognition.onerror = function(event) {
                statusMessage.textContent = "Sprachfehler oder abgebrochen.";
                resetButton();
            };

            recognition.onend = function() {
                isRecording = false;
                resetButton();
            };
        } else {
            statusMessage.textContent = "Keine Spracherkennung im Browser.";
            recordBtn.disabled = true;
        }

        function toggleSpeechRecognition() {
            const currentKey = localStorage.getItem('openai_user_api_key');
            if (!currentKey) {
                alert('Bitte hinterlege zuerst deinen OpenAI API-Key oben über "⚙️ Schlüssel & Test"!');
                settingsBox.classList.remove('hidden');
                return;
            }

            if (!recognition) {
                alert('Spracherkennung wird von diesem Browser leider nicht unterstützt.');
                return;
            }

            if (isRecording) {
                recognition.stop();
            } else {
                try {
                    recognition.start();
                } catch (e) {
                    // Falls sie bereits lief, einmal stoppen und neu starten
                    recognition.stop();
                    setTimeout(() => recognition.start(), 200);
                }
            }
        }

        function resetButton() {
            isRecording = false;
            recordBtn.classList.remove('bg-emerald-600', 'hover:bg-emerald-700', 'animate-pulse');
            recordBtn.classList.add('bg-red-600', 'hover:bg-red-700');
            recordText.textContent = "SPRECHEN";
        }

        // Anfrage an OpenAI senden (gpt-4o-mini)
        async function sendToOpenAI(text) {
            const key = localStorage.getItem('openai_user_api_key');
            outputBox.textContent = "Verarbeite mit OpenAI...";

            try {
                const response = await fetch('https://api.openai.com/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${key}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        model: "gpt-4o-mini",
                        messages: [
                            {
                                role: "system",
                                content: "Du bist ein hilfreicher Assistent für den Alltag. Analysiere den gesprochenen Satz, fasse das Wichtigste zusammen und antworte kurz, freundlich und klar auf Deutsch."
                            },
                            {
                                role: "user",
                                content: text
                            }
                        ]
                    })
                });

                if (!response.ok) {
                    throw new Error("API-Anfrage fehlgeschlagen");
                }

                const data = await response.json();
                const aiReply = data.choices[0].message.content;

                outputBox.textContent = aiReply;

                // In die lokale Liste eintragen
                const newEntry = {
                    text: aiReply,
                    date: new Date().toLocaleDateString('de-DE', { hour: '2-digit', minute: '2-digit' })
                };

                entries.unshift(newEntry);
                if (entries.length > 5) entries.pop();
                localStorage.setItem('openai_helfer_entries', JSON.stringify(entries));
                renderEntries();

            } catch (error) {
                outputBox.textContent = "Fehler bei der KI-Verarbeitung. Prüfe den API-Key.";
                console.error(error);
            }
        }

        function renderEntries() {
            if (entries.length === 0) {
                entryList.innerHTML = '<li class="text-slate-500">Keine Einträge vorhanden.</li>';
                return;
            }

            entryList.innerHTML = '';
            entries.forEach(entry => {
                const li = document.createElement('li');
                li.className = "bg-slate-50 p-3 rounded-xl border border-slate-100 flex justify-between items-center text-base";
                li.innerHTML = `<span>${entry.text}</span> <span class="text-xs text-slate-400">${entry.date}</span>`;
                entryList.appendChild(li);
            });
        }
    </script>
</body>
</html>
