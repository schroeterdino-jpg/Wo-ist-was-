<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smarter Sprach-Assistent</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h1 {
            font-size: 1.5rem;
            margin-bottom: 10px;
        }
        #status-message {
            font-weight: bold;
            color: #007aff;
            margin-bottom: 15px;
        }
        .section {
            margin-top: 20px;
            padding-top: 10px;
            border-top: 1px solid #eee;
        }
    </style>
</head>
<body>

<div class="container">
    <h1 id="user-greeting">Hallo Dino!</h1>
    <div id="status-message">Bereit.</div>

    <div class="section">
        <h3>App-Steuerung & Listen</h3>
        <div id="app-content">
            <!-- Hier werden deine Listen und Inhalte gerendert -->
        </div>
    </div>
</div>

<script>
    // Globale Variablen & Hilfsklassen (Beispiel-Deklarationen)
    let currentUserName = getPersistentData('user_custom_name', 'Dino');
    let memoryItems = JSON.parse(getPersistentData('helfer_memory', '{}'));
    let savedContacts = JSON.parse(getPersistentData('helfer_contacts', '{}'));
    let calendarEntries = [];
    let reminderEntries = [];
    let shoppingEntries = JSON.parse(getPersistentData('helfer_shopping', '[]'));
    let todoEntries = JSON.parse(getPersistentData('helfer_todo_entries', '[]'));

    const statusMessage = document.getElementById('status-message');
    const userNameInput = document.getElementById('user-name-input');

    function getPersistentData(key, fallback) {
        return localStorage.getItem(key) || fallback;
    }

    function setPersistentData(key, value) {
        localStorage.setItem(key, value);
    }

    function updateUserGreeting() {
        const greetingEl = document.getElementById('user-greeting');
        if (greetingEl) greetingEl.textContent = `Hallo ${currentUserName}!`;
    }

    function speak(text) {
        if ('speechSynthesis' in window) {
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'de-DE';
            window.speechSynthesis.speak(utterance);
        }
    }

    function renderAllLists() {
        // Logik zum Rendern der Listen in der UI
    }

    function searchMemory(query) {
        const results = [];
        for (const [key, value] of Object.entries(memoryItems)) {
            if (key.includes(query.toLowerCase()) || value.toLowerCase().includes(query.toLowerCase())) {
                results.push({ key, value });
            }
        }
        return results;
    }

    async function fetchLocationData() {
        return new Promise((resolve) => {
            if (!navigator.geolocation) {
                resolve({ fehler: "Geolocation wird von deinem Browser nicht unterstützt." });
                return;
            }
            navigator.geolocation.getCurrentPosition(async (position) => {
                const lat = position.coords.latitude;
                const lon = position.coords.longitude;
                try {
                    const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}`);
                    const data = await res.json();
                    resolve({
                        koordinaten: { lat, lon },
                        details: data.address
                    });
                } catch (e) {
                    resolve({
                        koordinaten: { lat, lon },
                        details: {},
                        fehler: "Adresse konnte nicht ermittelt werden."
                    });
                }
            }, () => {
                resolve({ fehler: "Standortzugriff wurde verweigert oder ist fehlgeschlagen." });
            });
        });
    }

    async function fetchWeatherData() {
        // Beispielhafter Wetter-Call
        return { info: "Sonnig, 20°C" };
    }

    function showLocationSharePrompt(locationName, shareText) {
        const confirmShare = confirm(`${locationName}\n\nMöchtest du diesen Standort jetzt über WhatsApp teilen?`);
        if (confirmShare) {
            window.location.href = `https://api.whatsapp.com/send?text=${encodeURIComponent(shareText)}`;
        }
    }

    async function addGoogleCalendarReminder(text, time) { /* Kalender-Erinnerungslogik */ }
    async function addGoogleCalendarEvent(text, time) { /* Kalender-Terminlogik */ }
    async function deleteCalendarEntry(id) { /* Termin löschen */ }
    async function deleteReminderEntry(id) { /* Erinnerung löschen */ }
    async function fetchGoogleCalendarEvents() { /* Events abrufen */ }

    // HAUPTFUNKTION: Smart Groq Verarbeiter mit flexibler Standort-Erkennung
    async function sendToGroqSmart(text) {
        const key = getPersistentData('user_api_key', '');
        if (statusMessage) statusMessage.textContent = "Verarbeite Befehl...";

        let weatherInfo = null;
        let locationInfo = null;
        const lowerText = text.toLowerCase();

        // Flexible Abfrage für alle Standort-Varianten
        const isLocationQuery = /(wo bin ich|wo befinde|standort|aktueller ort|welche straße|welcher ort|wo bin|wo sind wir|verwirrt|orientierungslos|verlaufen|hilfe wo|sag mir wo|zeig mir.*standort|weiß nicht wo|wo ich bin)/i.test(lowerText);

        if (isLocationQuery) {
            if (statusMessage) statusMessage.textContent = "Bestimme Standort...";
            locationInfo = await fetchLocationData();
        }

        // Flexible Abfrage für Wetter
        const isWeatherQuery = /(wetter|regenschirm|regen|draußen|grad|temperatur|jacke|anziehen|kalt|warm|sonne|frieren)/i.test(lowerText);

        if (isWeatherQuery) {
            if (statusMessage) statusMessage.textContent = "Hole Wetter...";
            weatherInfo = await fetchWeatherData();
        }

        const now = new Date();
        const nowGermanIso = now.toLocaleString('sv-SE', { timeZone: 'Europe/Berlin' }).replace(' ', 'T');

        const contextData = {
            heute_datum: nowGermanIso,
            aktuelles_jahr: now.getFullYear(),
            gedächtnis: memoryItems,
            kontakte: savedContacts,
            termine: calendarEntries,
            erinnerungen: reminderEntries,
            einkauf: shoppingEntries.map(s => s.text),
            aufgaben_und_notizen: todoEntries.map(t => t.text),
            wetter: weatherInfo,
            standort: locationInfo
        };

        const systemPrompt = "Du bist " + currentUserName + "s smarter, persönlicher Alltags-Assistent.\n" +
        "Aktueller Daten-Kontext: " + JSON.stringify(contextData) + "\n\n" +
        "WICHTIG ZUR ZEIT & DATUM:\n" +
        "- Aktuelles Datum und deutsche Ortszeit: " + nowGermanIso + ".\n" +
        "- Berücksichtige bei Datums- und Zeitangaben immer die deutsche Zeitzone (Europe/Berlin).\n\n" +
        "Analysiere den Sprachbefehl des Benutzers und unterscheide PRÄZISE:\n\n" +
        "STRIKTE CATEGORY-REGELN:\n" +
        "- \"forgot_check\": Wenn der Benutzer fragt, ob er etwas vergessen hat.\n" +
        "- \"chat\": Fragen nach Inhalten aus den Listen (Einkauf, Aufgaben, Termine).\n" +
        "- \"shopping\": NEUE Artikel zur Einkaufsliste HINZUFÜGEN.\n" +
        "- \"todo\": Aufgaben, Notizen oder Gedanken speichern.\n" +
        "- \"memory_store\": Feste Fakten, Standorte von Gegenständen oder persönliches Wissen SPEICHERN.\n" +
        "- \"memory_search\": Nach gespeicherten Infos im Gedächtnis fragen.\n" +
        "- \"calendar_delete\": Termin LÖSCHEN oder ENTFERNEN.\n" +
        "- \"reminder_delete\": Erinnerung löschen.\n" +
        "- \"name_change\": Wie der Benutzer genannt werden möchte.\n" +
        "- \"location\": Fragen nach dem Standort oder Orientierungslosigkeit.\n" +
        "- \"reminder\": Neue zeitgesteuerte Erinnerung anlegen.\n" +
        "- \"calendar\": Neuer fester Kalender-Termin anlegen.\n" +
        "- \"call\": Telefonanruf starten.\n\n" +
        "MEHRSPRACHIGKEIT:\n" +
        "- Antworte immer in der Sprache des Benutzers.\n\n" +
        "Gib IMMER ein valides JSON-Objekt zurück mit:\n" +
        "- type: \"forgot_check\", \"chat\", \"location\", \"memory_store\", \"memory_search\", \"todo\", \"calendar\", \"calendar_delete\", \"reminder\", \"reminder_delete\", \"shopping\", \"call\", \"name_change\"\n" +
        "- new_name\n" +
        "- memory_key, memory_value, memory_search_query\n" +
        "- todo_items, shopping_items, reminder_text, reminder_time, calendar_text, calendar_time, call_contact\n" +
        "- calendar_delete_query\n" +
        "- reminder_delete_query\n" +
        "- reply: Natürliche, grammatikalisch einwandfreie Antwort.";

        try {
            const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                method: 'POST',
                headers: { 'Authorization': `Bearer ${key}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    model: "openai/gpt-oss-120b",
                    response_format: { type: "json_object" },
                    messages: [
                        { role: "system", content: systemPrompt },
                        { role: "user", content: text }
                    ]
                })
            });

            const data = await res.json();
            const ai = JSON.parse(data.choices[0].message.content);

            if (ai.type === 'name_change' && ai.new_name) {
                currentUserName = ai.new_name.trim();
                setPersistentData('user_custom_name', currentUserName);
                if (userNameInput) userNameInput.value = currentUserName;
                updateUserGreeting();
            } else if (ai.type === 'location' || isLocationQuery) {
                // Reagiert nun verlässlich auf alle Standort-Fragen
                let responseText = "";
                
                if (locationInfo && !locationInfo.fehler && locationInfo.details) {
                    const road = locationInfo.details.road || locationInfo.details.pedestrian || "einer unbekannten Straße";
                    const houseNumber = locationInfo.details.house_number ? ` ${locationInfo.details.house_number}` : "";
                    const city = locationInfo.details.city || locationInfo.details.town || locationInfo.details.village || locationInfo.details.suburb || "";
                    const lat = locationInfo.koordinaten.lat;
                    const lon = locationInfo.koordinaten.lon;

                    const locationName = `${road}${houseNumber}${city ? ' in ' + city : ''}`;
                    responseText = `Du bist aktuell im ${locationName}. Möchtest du deinen Standort per WhatsApp teilen?`;

                    const mapsUrl = `https://maps.google.com/?q=${lat},${lon}`;
                    const shareText = `Hallo, ich bin gerade hier: ${mapsUrl}`;

                    showLocationSharePrompt(locationName, shareText);

                } else if (locationInfo && locationInfo.fehler) {
                    responseText = locationInfo.fehler;
                } else {
                    responseText = `Ich konnte deinen aktuellen Standort leider nicht genau ermitteln.`;
                }
                
                renderAllLists();
                speak(responseText);
                if (statusMessage) statusMessage.textContent = "Standort ermittelt.";
                return;
            } else if (ai.type === 'shopping') {
                const items = ai.shopping_items || (ai.shopping_item ? [ai.shopping_item] : []);
                items.forEach((item, index) => {
                    if (item && item.trim()) {
                        shoppingEntries.unshift({ id: Date.now() + index, text: item.trim() });
                    }
                });
                setPersistentData('helfer_shopping', JSON.stringify(shoppingEntries));
            } else if (ai.type === 'todo') {
                const items = ai.todo_items || (ai.todo_text ? [ai.todo_text] : []);
                items.forEach((item, index) => {
                    if (item && item.trim()) {
                        todoEntries.unshift({ id: Date.now() + index, text: item.trim(), createdDate: 'Per Sprache' });
                    }
                });
                setPersistentData('helfer_todo_entries', JSON.stringify(todoEntries));
            } else if (ai.type === 'memory_store' && ai.memory_key) {
                let val = ai.memory_value || "gespeichert";
                if (typeof val === 'object') {
                    val = JSON.stringify(val);
                }
                memoryItems[ai.memory_key.toLowerCase()] = String(val);
                setPersistentData('helfer_memory', JSON.stringify(memoryItems));
            } else if (ai.type === 'memory_search') {
                const searchQuery = ai.memory_search_query || text;
                const results = searchMemory(searchQuery);

                let responseText = ai.reply;

                if (!responseText) {
                    if (results.length > 0) {
                        const foundList = results.map(r => `${r.key}: ${r.value}`).join(', ');
                        responseText = `Im Gedächtnis steht: ${foundList}.`;
                    } else {
                        responseText = `Ich habe dazu leider nichts im Gedächtnis gefunden.`;
                    }
                }

                renderAllLists();
                speak(responseText);
                if (statusMessage) statusMessage.textContent = "Gedächtnis durchsucht.";
                return;
            } else if (ai.type === 'reminder_delete') {
                const query = (ai.reminder_delete_query || text).toLowerCase().replace('lösche', '').replace('lösch', '').replace('erinnerung', '').trim();
                const match = reminderEntries.find(e => e.text.toLowerCase().includes(query) || (query.length > 2 && query.includes(e.text.toLowerCase())));
                if (match) {
                    await deleteReminderEntry(match.id);
                } else if (reminderEntries.length > 0) {
                    await deleteReminderEntry(reminderEntries[0].id);
                }
            } else if (ai.type === 'reminder') {
                let rText = ai.reminder_text || text;
                rText = rText.replace(/^(erinnere mich daran|erinnere mich|erinnere|denk daran|ich muss)\s*,?\s*(dass\s+)?/i, '').trim();
                if (rText.length > 0) {
                    rText = rText.charAt(0).toUpperCase() + rText.slice(1);
                }
                await addGoogleCalendarReminder(rText, ai.reminder_time);
            } else if (ai.type === 'calendar_delete') {
                const query = (ai.calendar_delete_query || text).toLowerCase()
                    .replace('lösche', '')
                    .replace('lösch', '')
                    .replace('entferne', '')
                    .replace('termin', '')
                    .trim();

                const match = calendarEntries.find(e => {
                    const entryText = e.text.toLowerCase();
                    return entryText.includes(query) || (query.length > 2 && query.includes(entryText));
                });

                if (match) {
                    await deleteCalendarEntry(match.id);
                } else if (calendarEntries.length > 0 && query.length < 3) {
                    await deleteCalendarEntry(calendarEntries[0].id);
                }
            } else if (ai.type === 'calendar' || ai.calendar_text) {
                let cText = ai.calendar_text || text;
                cText = cText.replace(/^(trage|trage ein|erstelle|neuer termin|termin)\s*,?\s*/i, '').trim();
                if (cText.length > 0) {
                    cText = cText.charAt(0).toUpperCase() + cText.slice(1);
                }
                await addGoogleCalendarEvent(cText, ai.calendar_time);
            } else if (ai.type === 'call' && ai.call_contact) {
                const foundKey = Object.keys(savedContacts).find(k => k.includes(ai.call_contact.toLowerCase()));
                if (foundKey) {
                    window.location.href = `tel:${savedContacts[foundKey].phone}`;
                }
            }

            if (ai.type === 'calendar' || ai.type === 'calendar_delete') {
                await fetchGoogleCalendarEvents();
            } else {
                renderAllLists();
            }

            speak(ai.reply || `Erledigt, ${currentUserName}.`);
            if (statusMessage) statusMessage.textContent = "Fertig.";
        } catch (e) {
            renderAllLists();
            speak("Entschuldige, das konnte ich leider nicht genau verarbeiten.");
            if (statusMessage) statusMessage.textContent = "Fehler bei der Verarbeitung.";
        }
    }

    // Initialisierung beim Laden
    window.addEventListener('DOMContentLoaded', () => {
        updateUserGreeting();
        renderAllLists();
    });
</script>

</body>
</html>
