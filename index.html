<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mein Helfer – Sprachassistent</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Identity Services (OAuth / Login) -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        body { font-size: 1.25rem; }
    </style>
</head>
<body class="bg-slate-100 text-slate-900 min-h-screen flex flex-col justify-between">

    <!-- Kopfbereich -->
    <header class="bg-blue-700 text-white p-6 text-center shadow-md relative">
        <div class="flex justify-between items-center max-w-md mx-auto">
            <div></div>
            <div>
                <h1 class="text-3xl font-bold">Mein Alltags-Helfer</h1>
                <p id="userNameDisplay" class="text-lg text-blue-100 mt-1">Hallo, Dino!</p>
            </div>
            <button onclick="toggleSettings()" class="bg-blue-800 hover:bg-blue-900 text-white px-3 py-2 rounded-lg text-sm shadow">
                ⚙️ Einstellungen
            </button>
        </div>
    </header>

    <!-- Einstellungs-Box -->
    <div id="settingsBox" class="hidden bg-amber-50 border-b border-amber-200 p-4 shadow-inner">
        <div class="container mx-auto max-w-md space-y-4">
            <!-- Wie soll ich dich nennen? -->
            <div>
                <label class="block text-sm font-bold text-amber-900 mb-1">Wie soll ich dich nennen?:</label>
                <div class="flex gap-2">
                    <input type="text" id="userNameInput" placeholder="Dein Name..." class="flex-grow p-2 border border-amber-300 rounded-lg text-base">
                    <button onclick="saveUserNameSetting()" class="bg-amber-600 hover:bg-amber-700 text-white px-4 py-2 rounded-lg text-base font-semibold">Speichern</button>
                </div>
            </div>

            <!-- Groq API Key -->
            <div>
                <label class="block text-sm font-bold text-amber-900 mb-1">Groq API-Key (gsk_...):</label>
                <div class="flex gap-2">
                    <input type="password" id="apiKeyInput" placeholder="gsk_..." class="flex-grow p-2 border border-amber-300 rounded-lg text-base">
                    <button onclick="saveApiKey()" class="bg-amber-600 hover:bg-amber-700 text-white px-4 py-2 rounded-lg text-base font-semibold">Speichern</button>
                </div>
            </div>

            <!-- Google Client ID -->
            <div>
                <label class="block text-sm font-bold text-amber-900 mb-1">Google Client-ID:</label>
                <div class="flex gap-2">
                    <input type="text" id="googleClientIdInput" placeholder="399573320370-..." class="flex-grow p-2 border border-amber-300 rounded-lg text-base">
                    <button onclick="saveGoogleClientId()" class="bg-amber-600 hover:bg-amber-700 text-white px-4 py-2 rounded-lg text-base font-semibold">Speichern</button>
                </div>
            </div>

            <div class="flex flex-col gap-2">
                <button onclick="checkGroqConnection()" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-2 rounded-lg text-sm font-medium">
                    🔍 Groq-Verbindung prüfen
                </button>
                <button onclick="loginWithGoogle()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-2 rounded-lg text-sm font-medium flex items-center justify-center gap-2">
                    📅 Mit Google Kalender verbinden
                </button>
            </div>
            <p id="connectionStatus" class="text-xs text-amber-800 mt-2 font-medium break-all"></p>
        </div>
    </div>

    <!-- Hauptbereich -->
    <main class="container mx-auto p-4 max-w-md flex-grow flex flex-col justify-center space-y-6">

        <!-- Großer Mikrofon-Button -->
        <div class="flex flex-col items-center">
            <button id="recordBtn" onclick="toggleSpeechRecognition()" class="w-40 h-40 bg-red-600 hover:bg-red-700 text-white rounded-full flex flex-col items-center justify-center shadow-2xl transition transform active:scale-95 border-4 border-white cursor-pointer">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-20 w-20 mb-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z" />
                </svg>
                <span id="recordText" class="text-sm font-semibold tracking-wide">SPRECHEN</span>
            </button>
            <p id="statusMessage" class="mt-4 text-center font-medium text-slate-700 h-8">Drücken und sprechen...</p>
        </div>

        <!-- Ergebnis-Box -->
        <div class="bg-white p-5 rounded-2xl shadow-md border border-slate-200">
            <h2 class="text-xl font-bold text-blue-800 mb-2">Antwort des Assistenten:</h2>
            <p id="outputBox" class="text-slate-600 italic">Noch nichts eingegeben...</p>
        </div>

        <!-- Echte Notizen & Termine (Nur für Notizen und Kalender!) -->
        <div class="bg-white p-5 rounded-2xl shadow-md border border-slate-200">
            <h2 class="text-xl font-bold text-blue-800 mb-3">Notizen & Termine:</h2>
            <ul id="entryList" class="space-y-2 text-lg">
                <li class="text-slate-500">Keine aktiven Notizen.</li>
            </ul>
        </div>

    </main>

    <!-- Fußbereich -->
    <footer class="bg-slate-200 text-center p-4 text-sm text-slate-600">
        Einfach bedienbare Web-App für den Alltag
    </footer>

    <!-- JavaScript -->
    <script>
        const recordBtn = document.getElementById('recordBtn');
        const recordText = document.getElementById('recordText');
        const statusMessage = document.getElementById('statusMessage');
        const outputBox = document.getElementById('outputBox');
        const entryList = document.getElementById('entryList');
        const settingsBox = document.getElementById('settingsBox');
        const apiKeyInput = document.getElementById('apiKeyInput');
        const googleClientIdInput = document.getElementById('googleClientIdInput');
        const userNameInput = document.getElementById('userNameInput');
        const userNameDisplay = document.getElementById('userNameDisplay');
        const connectionStatus = document.getElementById('connectionStatus');

        // Benutzername verwalten
        let currentUserName = localStorage.getItem('user_custom_name') || "Dino";
        userNameInput.value = currentUserName;
        updateUserGreeting();

        function updateUserGreeting() {
            userNameDisplay.textContent = `Hallo, ${currentUserName}!`;
        }

        function saveUserNameSetting() {
            const newName = userNameInput.value.trim();
            if (newName) {
                currentUserName = newName;
                localStorage.setItem('user_custom_name', currentUserName);
                updateUserGreeting();
                connectionStatus.textContent = `Name auf "${currentUserName}" geändert.`;
            } else {
                alert('Bitte gib einen Namen ein.');
            }
        }

        // Echte Notizen & Kalender-Einträge
        let entries = JSON.parse(localStorage.getItem('helfer_entries')) || [];
        renderEntries();

        // Unsichtbares Gedächtnis für Gegenstände & Orte
        let memoryItems = JSON.parse(localStorage.getItem('helfer_memory')) || {};

        const savedKey = localStorage.getItem('user_api_key');
        if (savedKey) apiKeyInput.value = savedKey;

        const savedClientId = localStorage.getItem('google_client_id') || "399573320370-qka01ghj0s88eoair7lla665cbj10o4g.apps.googleusercontent.com";
        googleClientIdInput.value = savedClientId;
        localStorage.setItem('google_client_id', savedClientId);

        let tokenClient;
        let accessToken = localStorage.getItem('google_access_token');

        function toggleSettings() {
            settingsBox.classList.toggle('hidden');
        }

        function saveApiKey() {
            const key = apiKeyInput.value.trim();
            if (key) {
                localStorage.setItem('user_api_key', key);
                connectionStatus.textContent = "Groq-Schlüssel gespeichert.";
            } else {
                alert('Bitte gib einen gültigen Schlüssel ein.');
            }
        }

        function saveGoogleClientId() {
            const clientId = googleClientIdInput.value.trim();
            if (clientId) {
                localStorage.setItem('google_client_id', clientId);
                connectionStatus.textContent = "Google Client-ID gespeichert.";
            } else {
                alert('Bitte gib eine Client-ID ein.');
            }
        }

        function loginWithGoogle() {
            const clientId = localStorage.getItem('google_client_id');
            if (!clientId) {
                alert('Bitte zuerst die Google Client-ID eintragen!');
                return;
            }

            try {
                tokenClient = google.accounts.oauth2.initTokenClient({
                    client_id: clientId,
                    scope: 'https://www.googleapis.com/auth/calendar.events',
                    callback: (response) => {
                        if (response.error) {
                            connectionStatus.textContent = `❌ Fehler: ${response.error}`;
                            return;
                        }
                        accessToken = response.access_token;
                        localStorage.setItem('google_access_token', accessToken);
                        connectionStatus.textContent = "✅ Mit Google Kalender verbunden!";
                    },
                });
                tokenClient.requestAccessToken();
            } catch (error) {
                connectionStatus.textContent = `❌ Fehler: ${error.message}`;
            }
        }

        function speak(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'de-DE';
                utterance.rate = 1.0;
                window.speechSynthesis.speak(utterance);
            }
        }

        async function checkGroqConnection() {
            const key = localStorage.getItem('user_api_key');
            if (!key) {
                connectionStatus.textContent = "⚠️ Kein Schlüssel hinterlegt.";
                return;
            }

            connectionStatus.textContent = "Prüfe Verbindung...";
            try {
                const response = await fetch('https://api.groq.com/openai/v1/models', {
                    method: 'GET',
                    headers: { 'Authorization': `Bearer ${key}` }
                });

                if (response.ok) {
                    connectionStatus.textContent = `✅ Groq verbunden!`;
                } else {
                    connectionStatus.textContent = `❌ Fehler bei Verbindung.`;
                }
            } catch (error) {
                connectionStatus.textContent = `❌ Netzwerkfehler.`;
            }
        }

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition = null;
        let isRecording = false;

        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.lang = 'de-DE';
            recognition.interimResults = false;
            recognition.maxAlternatives = 1;

            recognition.onstart = function() {
                isRecording = true;
                statusMessage.textContent = "Höre zu... Bitte sprechen.";
                recordBtn.classList.remove('bg-red-600', 'hover:bg-red-700');
                recordBtn.classList.add('bg-emerald-600', 'hover:bg-emerald-700', 'animate-pulse');
                recordText.textContent = "HÖRE...";
            };

            recognition.onresult = function(event) {
                const speechResult = event.results[0][0].transcript;
                outputBox.textContent = `"${speechResult}"`;
                sendToGroqSmart(speechResult);
            };

            recognition.onerror = function() {
                statusMessage.textContent = "Sprachfehler oder abgebrochen.";
                resetButton();
            };

            recognition.onend = function() {
                isRecording = false;
                resetButton();
            };
        } else {
            statusMessage.textContent = "Keine Spracherkennung im Browser.";
            recordBtn.disabled = true;
        }

        function toggleSpeechRecognition() {
            const currentKey = localStorage.getItem('user_api_key');
            if (!currentKey) {
                alert('Bitte hinterlege zuerst deinen Groq API-Key oben über "⚙️ Einstellungen"!');
                settingsBox.classList.remove('hidden');
                return;
            }

            if (!recognition) {
                alert('Spracherkennung wird vom Browser nicht unterstützt.');
                return;
            }

            if (isRecording) {
                recognition.stop();
            } else {
                try {
                    recognition.start();
                } catch (e) {
                    recognition.stop();
                    setTimeout(() => recognition.start(), 200);
                }
            }
        }

        function resetButton() {
            isRecording = false;
            recordBtn.classList.remove('bg-emerald-600', 'hover:bg-emerald-700', 'animate-pulse');
            recordBtn.classList.add('bg-red-600', 'hover:bg-red-700');
            recordText.textContent = "SPRECHEN";
        }

        async function sendToGroqSmart(text) {
            const key = localStorage.getItem('user_api_key');
            outputBox.textContent = "Verarbeite...";

            const memoryContext = JSON.stringify(memoryItems);

            try {
                const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${key}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        model: "openai/gpt-oss-120b",
                        response_format: { type: "json_object" },
                        messages: [
                            {
                                role: "system",
                                content: `Du bist ein sehr freundlicher, herzlicher und hilfsbereiter deutscher Alltags-Assistent. 
                                Der Benutzer wird von dir aktuell mit "${currentUserName}" angesprochen.
                                Aktuelles Jahr ist 2026, heute ist ${new Date().toISOString().split('T')[0]}.
                                Bisheriges unsichtbares Gedächtnis über Gegenstände: ${memoryContext}
                                
                                AUFGABEN & TYPEN:
                                1. "name_change": Wenn der Benutzer möchte, dass du ihn anders nennst (z.B. "Nenne mich Chef", "Ab jetzt heiße ich Meister"). Extrahiere den neuen Namen in "new_name".
                                2. "item_store": Wenn der Benutzer sagt, er legt einen Gegenstand irgendwo hin (z.B. "Schlüssel liegt auf dem Tisch", "Kuscheltier unters Bett gepackt").
                                3. "item_query": Wenn der Benutzer fragt, wo ein Gegenstand ist (z.B. "Wo ist mein Schlüssel?").
                                4. "note": Echte Notizen oder Erinnerungen für den Alltag (z.B. "Vergiss nicht einkaufen zu gehen").
                                5. "calendar": Echte Kalendertermine mit Datum/Uhrzeit.

                                GRAMMATIK-REGELN:
                                - Antworte immer absolut fehlerfrei auf Deutsch im besten Hochdeutsch.
                                - Verwende in der Antwort ("reply") immer den Namen "${currentUserName}" (oder den neuen Namen, wenn er geändert wird) und sei sehr freundlich.
                                
                                Gib ein JSON-Objekt zurück mit:
                                - "type": string ("name_change", "item_store", "item_query", "note", "calendar")
                                - "new_name": string (nur bei name_change, ansonsten leer)
                                - "item_name": string (bei item_store/item_query im Nominativ, z.B. "Schlüssel")
                                - "item_location": string (bei item_store im Dativ, z.B. "auf dem Küchentisch")
                                - "note_text": string (nur bei type "note", der saubere Text für die Notizen-Liste)
                                - "is_event": boolean (true nur bei Kalender)
                                - "summary": string (Titel für Kalender)
                                - "start_time": string (ISO Datum für Kalender)
                                - "reply": string (Deine herzliche, freundliche Antwort mit Namen "${currentUserName}")`
                            },
                            {
                                role: "user",
                                content: text
                            }
                        ]
                    })
                });

                if (!response.ok) throw new Error("API-Anfrage fehlgeschlagen");

                const data = await response.json();
                const aiData = JSON.parse(data.choices[0].message.content);

                let finalReply = aiData.reply;

                // 1. Namensänderung verarbeiten
                if (aiData.type === 'name_change' && aiData.new_name) {
                    currentUserName = aiData.new_name;
                    localStorage.setItem('user_custom_name', currentUserName);
                    userNameInput.value = currentUserName;
                    updateUserGreeting();
                    finalReply = `Alles klar, ab jetzt nenne ich dich ${currentUserName}!`;
                }

                // 2. Gegenstand unsichtbar im Hintergrund speichern
                if (aiData.type === 'item_store' && aiData.item_name && aiData.item_location) {
                    let cleanName = aiData.item_name.toLowerCase();
                    memoryItems[cleanName] = aiData.item_location;
                    localStorage.setItem('helfer_memory', JSON.stringify(memoryItems));
                    // WICHTIG: KEIN Eintrag in die sichtbare Notizen-Liste!
                }

                // 3. Gegenstand im Hintergrund abfragen
                if (aiData.type === 'item_query' && aiData.item_name) {
                    let cleanQuery = aiData.item_name.toLowerCase();
                    let foundLocation = null;
                    let matchedName = aiData.item_name;

                    for (let storedKey in memoryItems) {
                        if (cleanQuery.includes(storedKey) || storedKey.includes(cleanQuery)) {
                            foundLocation = memoryItems[storedKey];
                            matchedName = storedKey.charAt(0).toUpperCase() + storedKey.slice(1);
                            break;
                        }
                    }

                    if (foundLocation) {
                        finalReply = `Kein Problem, ${currentUserName}! Dein ${matchedName} liegt ${foundLocation}.`;
                    } else {
                        finalReply = `Tut mir leid, ${currentUserName}, ich weiß leider nicht, wo dein ${aiData.item_name} liegt.`;
                    }
                }

                outputBox.textContent = finalReply;
                speak(finalReply);

                // 4. Nur echte Notizen oder Kalender kommen in die sichtbare Liste!
                if (aiData.type === 'note' || aiData.type === 'calendar') {
                    let calendarEventId = null;
                    if (aiData.is_event) {
                        calendarEventId = await createGoogleCalendarEvent(aiData.summary, aiData.start_time);
                        if (calendarEventId) {
                            finalReply += " In Kalender eingetragen.";
                        }
                    }

                    const newEntry = {
                        id: Date.now(),
                        calendarId: calendarEventId,
                        text: aiData.note_text || finalReply,
                        day: new Date().toLocaleDateString('de-DE'),
                        date: new Date().toLocaleDateString('de-DE', { hour: '2-digit', minute: '2-digit' })
                    };

                    entries.unshift(newEntry);
                    if (entries.length > 10) entries.pop();
                    localStorage.setItem('helfer_entries', JSON.stringify(entries));
                    renderEntries();
                }

            } catch (error) {
                outputBox.textContent = `❌ Fehler bei der Verarbeitung.`;
                speak(`Es gab leider einen Fehler, ${currentUserName}.`);
                console.error(error);
            }
        }

        async function createGoogleCalendarEvent(summary, startTimeStr) {
            if (!accessToken) return null;

            const startDate = new Date(startTimeStr);
            const endDate = new Date(startDate.getTime() + 60 * 60 * 1000);

            const event = {
                summary: summary,
                start: { dateTime: startDate.toISOString() },
                end: { dateTime: endDate.toISOString() }
            };

            try {
                const res = aimport('https://www.googleapis.com/calendar/v3/calendars/primary/events', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${accessToken}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(event)
                });

                if (res.ok) {
                    const data = await res.json();
                    return data.id;
                }
            } catch (e) {
                console.error(e);
            }
            return null;
        }

        async function deleteEntry(id, calendarId) {
            if (calendarId && accessToken) {
                try {
                    await fetch(`https://www.googleapis.com/calendar/v3/calendars/primary/events/${calendarId}`, {
                        method: 'DELETE',
                        headers: { 'Authorization': `Bearer ${accessToken}` }
                    });
                } catch (e) {
                    console.error("Fehler beim Löschen im Kalender:", e);
                }
            }

            entries = entries.filter(e => e.id !== id);
            localStorage.setItem('helfer_entries', JSON.stringify(entries));
            renderEntries();
            speak("Eintrag gelöscht.");
        }

        function renderEntries() {
            if (entries.length === 0) {
                entryList.innerHTML = '<li class="text-slate-500">Keine aktiven Notizen.</li>';
                return;
            }

            entryList.innerHTML = '';
            entries.forEach(entry => {
                const li = document.createElement('li');
                li.className = "bg-slate-50 p-3 rounded-xl border border-slate-100 flex justify-between items-center text-base";
                li.innerHTML = `
                    <div>
                        <span>${entry.text}</span>
                        <div class="text-xs text-slate-400">${entry.date}</div>
                    </div>
                    <button onclick="deleteEntry(${entry.id}, '${entry.calendarId || ''}')" class="bg-red-500 hover:bg-red-600 text-white px-3 py-1 rounded-lg text-sm font-semibold ml-2">
                        Löschen
                    </button>
                `;
                entryList.appendChild(li);
            });
        }
    </script>
</body>
</html>
