<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mein Helfer – Sprachassistent</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Identity Services (OAuth / Login) -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    
    <!-- Eigenes Icon direkt aus dem Projektordner -->
    <link rel="icon" type="image/png" href="./dino.png">
    <link rel="apple-touch-icon" href="./dino.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">

    <style>
        body { font-size: 1.25rem; }
    </style>
</head>
<body class="bg-slate-100 text-slate-900 min-h-screen flex flex-col justify-between">

    <!-- Kopfbereich -->
    <header class="bg-blue-700 text-white p-6 text-center shadow-md relative">
        <div class="flex justify-between items-center max-w-md mx-auto">
            <div></div>
            <div>
                <h1 class="text-3xl font-bold">Mein Alltags-Helfer</h1>
                <p id="userNameDisplay" class="text-lg text-blue-100 mt-1">Hallo, Dino!</p>
            </div>
            <button onclick="toggleSettings()" class="bg-blue-800 hover:bg-blue-900 text-white px-3 py-2 rounded-lg text-sm shadow">
                ⚙️ Einstellungen
            </button>
        </div>
    </header>

    <!-- Einstellungs-Box -->
    <div id="settingsBox" class="hidden bg-amber-50 border-b border-amber-200 p-4 shadow-inner">
        <div class="container mx-auto max-w-md space-y-4">
            <div>
                <label class="block text-sm font-bold text-amber-900 mb-1">Wie soll ich dich nennen?:</label>
                <input type="text" id="userNameInput" placeholder="Dein Name..." class="w-full p-2 border border-amber-300 rounded-lg text-base bg-white">
            </div>

            <div>
                <label class="block text-sm font-bold text-amber-900 mb-1">Groq API-Key (gsk_...):</label>
                <input type="password" id="apiKeyInput" placeholder="gsk_..." class="w-full p-2 border border-amber-300 rounded-lg text-base bg-white">
            </div>

            <div>
                <label class="block text-sm font-bold text-amber-900 mb-1">Google Client-ID:</label>
                <input type="text" id="googleClientIdInput" placeholder="Client ID..." class="w-full p-2 border border-amber-300 rounded-lg text-base bg-white">
            </div>

            <!-- Kontakte für Schnell-Anruf -->
            <div class="border-t border-amber-200 pt-3">
                <label class="block text-sm font-bold text-amber-900 mb-1">📞 Schnell-Anruf Kontakte:</label>
                <div class="flex gap-2 mb-2">
                    <input type="text" id="contactNameInput" placeholder="Name (z.B. Simone)" class="w-1/2 p-2 border border-amber-300 rounded-lg text-base bg-white">
                    <input type="text" id="contactPhoneInput" placeholder="Nummer..." class="w-1/2 p-2 border border-amber-300 rounded-lg text-base bg-white">
                </div>
                <button onclick="saveContact()" class="w-full bg-amber-600 hover:bg-amber-700 text-white py-2 rounded-lg text-base font-semibold">Kontakt hinzufügen</button>
                <div id="contactListDisplay" class="mt-2 text-xs text-amber-900 space-y-1"></div>
            </div>

            <!-- Gedächtnis -->
            <div class="border-t border-amber-200 pt-3 space-y-2">
                <div class="flex justify-between items-center">
                    <label class="block text-sm font-bold text-amber-900">🔍 Gespeicherte Gegenstände & Passwörter:</label>
                    <button onclick="confirmAction('Möchtest du wirklich das gesamte Gedächtnis inkl. Passwörter löschen?', clearAllMemory)" class="bg-red-500 hover:bg-red-600 text-white px-2 py-1 rounded-lg text-xs font-semibold shadow">🗑️ Alles löschen</button>
                </div>
                <div id="categoryContainer" class="space-y-3 text-sm bg-white p-3 rounded-lg border border-amber-200">
                    <!-- Kategorien werden hier dynamisch eingefügt -->
                </div>
            </div>

            <div class="flex flex-col gap-2 border-t border-amber-200 pt-3">
                <button onclick="loginWithGoogle()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-2 rounded-lg text-sm font-medium flex items-center justify-center gap-2">
                    📅 Mit Google Kalender verbinden
                </button>
            </div>
            <p id="connectionStatus" class="text-xs text-amber-800 mt-2 font-medium break-all"></p>
        </div>
    </div>

    <!-- Hauptbereich -->
    <main class="container mx-auto p-4 max-w-md flex-grow flex flex-col justify-center space-y-6">

        <!-- Mikrofon-Button, Text-Fallback & Tages-Briefing -->
        <div class="flex flex-col items-center space-y-3">
            <button id="recordBtn" onclick="toggleSpeechRecognition()" class="w-40 h-40 bg-red-600 hover:bg-red-700 text-white rounded-full flex flex-col items-center justify-center shadow-2xl transition transform active:scale-95 border-4 border-white cursor-pointer">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-20 w-20 mb-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z" />
                </svg>
                <span id="recordText" class="text-sm font-semibold tracking-wide">SPRECHEN</span>
            </button>
            <p id="statusMessage" class="text-center font-medium text-slate-700 h-6">Drücken und sprechen...</p>

            <!-- Text-Fallback & Nochmal-Button -->
            <div class="w-full flex items-center gap-2 mt-1">
                <button onclick="repeatLastSpeech()" class="bg-slate-200 hover:bg-slate-300 text-slate-700 py-2.5 px-3 rounded-xl text-sm font-semibold shadow-sm flex items-center justify-center gap-1 shrink-0">
                    🔁 Nochmal
                </button>
                <div class="flex-grow flex gap-1">
                    <input type="text" id="textFallbackInput" placeholder="Oder Text tippen..." class="w-full p-2 border border-slate-300 rounded-xl text-sm bg-white focus:outline-none focus:border-blue-500" onkeydown="if(event.key==='Enter') submitTextFallback()">
                    <button onclick="submitTextFallback()" class="bg-blue-600 hover:bg-blue-700 text-white px-3 py-2 rounded-xl text-sm font-semibold shadow-sm shrink-0">Senden</button>
                </div>
            </div>

            <button onclick="triggerDailyBriefing()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-3 px-4 rounded-xl shadow-md font-bold text-lg flex items-center justify-center gap-2 mt-2">
                📋 Was steht heute an? (Briefing)
            </button>
        </div>

        <!-- Reiter-Navigation -->
        <div class="flex bg-slate-200 p-1 rounded-xl">
            <button id="tabCalendarBtn" onclick="switchTab('calendar')" class="flex-1 py-2 rounded-lg font-bold text-sm bg-white text-blue-800 shadow-sm transition">📅 Termine</button>
            <button id="tabTodoBtn" onclick="switchTab('todo')" class="flex-1 py-2 rounded-lg font-bold text-sm text-slate-600 transition">📝 To-Dos</button>
        </div>

        <!-- Ansicht: Kalender-Termine -->
        <div id="calendarView" class="bg-white p-5 rounded-2xl shadow-md border border-slate-200">
            <h2 class="text-xl font-bold text-blue-800 mb-3">📅 Kalender-Termine:</h2>
            <ul id="calendarList" class="space-y-2 text-lg">
                <li class="text-slate-500">Keine Termine eingetragen.</li>
            </ul>
        </div>

        <!-- Ansicht: To-Dos & Notizen -->
        <div id="todoView" class="hidden bg-white p-5 rounded-2xl shadow-md border border-slate-200 space-y-4">
            <h2 class="text-xl font-bold text-blue-800">📝 To-Dos & Notizen:</h2>
            <ul id="todoList" class="space-y-2 text-lg">
                <li class="text-slate-500">Keine offenen To-Dos.</li>
            </ul>
        </div>

    </main>

    <!-- Bestätigungs-Modal -->
    <div id="confirmModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl p-6 max-w-sm w-full shadow-2xl space-y-4 text-center">
            <h3 id="confirmModalText" class="text-lg font-bold text-slate-800">Bist du sicher?</h3>
            <div class="flex gap-3 pt-2">
                <button id="confirmModalNoBtn" class="flex-1 bg-slate-300 hover:bg-slate-400 text-slate-800 py-2 rounded-xl font-semibold">Abbrechen</button>
                <button id="confirmModalYesBtn" class="flex-1 bg-red-600 hover:bg-red-700 text-white py-2 rounded-xl font-semibold">Löschen</button>
            </div>
        </div>
    </div>

    <!-- Fußbereich -->
    <footer class="bg-slate-200 text-center p-4 text-sm text-slate-600 flex justify-between items-center px-6">
        <span>Einfach bedienbare Web-App</span>
        <span>Version 4.34</span>
    </footer>

    <!-- JavaScript -->
    <script>
        const recordBtn = document.getElementById('recordBtn');
        const recordText = document.getElementById('recordText');
        const statusMessage = document.getElementById('statusMessage');
        const calendarList = document.getElementById('calendarList');
        const todoList = document.getElementById('todoList');
        const categoryContainer = document.getElementById('categoryContainer');
        const settingsBox = document.getElementById('settingsBox');
        
        const apiKeyInput = document.getElementById('apiKeyInput');
        const googleClientIdInput = document.getElementById('googleClientIdInput');
        const userNameInput = document.getElementById('userNameInput');
        const userNameDisplay = document.getElementById('userNameDisplay');
        const connectionStatus = document.getElementById('connectionStatus');
        const textFallbackInput = document.getElementById('textFallbackInput');
        
        const contactNameInput = document.getElementById('contactNameInput');
        const contactPhoneInput = document.getElementById('contactPhoneInput');
        const contactListDisplay = document.getElementById('contactListDisplay');

        const calendarView = document.getElementById('calendarView');
        const todoView = document.getElementById('todoView');
        const tabCalendarBtn = document.getElementById('tabCalendarBtn');
        const tabTodoBtn = document.getElementById('tabTodoBtn');

        const confirmModal = document.getElementById('confirmModal');
        const confirmModalText = document.getElementById('confirmModalText');
        const confirmModalYesBtn = document.getElementById('confirmModalYesBtn');
        const confirmModalNoBtn = document.getElementById('confirmModalNoBtn');

        let lastSpokenText = "";
        let visiblePasswords = {};

        function confirmAction(question, onConfirm) {
            confirmModalText.textContent = question;
            confirmModal.classList.remove('hidden');
            
            const newYesBtn = confirmModalYesBtn.cloneNode(true);
            const newNoBtn = confirmModalNoBtn.cloneNode(true);
            confirmModalYesBtn.parentNode.replaceChild(newYesBtn, confirmModalYesBtn);
            confirmModalNoBtn.parentNode.replaceChild(newNoBtn, confirmModalNoBtn);

            newYesBtn.onclick = () => {
                confirmModal.classList.add('hidden');
                onConfirm();
            };
            newNoBtn.onclick = () => {
                confirmModal.classList.add('hidden');
            };
        }

        function getPersistentData(key, defaultValue) {
            let val = localStorage.getItem(key);
            if (!val || val === "null" || val === "undefined") {
                val = sessionStorage.getItem(key);
            }
            if (!val || val === "null" || val === "undefined") {
                return defaultValue;
            }
            return val;
        }

        function setPersistentData(key, value) {
            try { localStorage.setItem(key, value); } catch (e) {}
            try { sessionStorage.setItem(key, value); } catch (e) {}
        }

        let currentUserName = getPersistentData('user_custom_name', 'Dino');
        userNameInput.value = currentUserName;
        updateUserGreeting();

        let savedKey = getPersistentData('user_api_key', '');
        if (savedKey) apiKeyInput.value = savedKey;

        let savedClientId = getPersistentData('google_client_id', '399573320370-qka01ghj0s88eoair7lla665cbj10o4g.apps.googleusercontent.com');
        googleClientIdInput.value = savedClientId;
        setPersistentData('google_client_id', savedClientId);

        userNameInput.addEventListener('input', () => {
            currentUserName = userNameInput.value.trim() || "Dino";
            setPersistentData('user_custom_name', currentUserName);
            updateUserGreeting();
        });

        apiKeyInput.addEventListener('input', () => {
            setPersistentData('user_api_key', apiKeyInput.value.trim());
            connectionStatus.textContent = "API-Key gespeichert.";
        });

        googleClientIdInput.addEventListener('input', () => {
            setPersistentData('google_client_id', googleClientIdInput.value.trim());
            connectionStatus.textContent = "Client-ID gespeichert.";
        });

        function updateUserGreeting() {
            userNameDisplay.textContent = `Hallo, ${currentUserName}!`;
        }

        let calendarEntries = JSON.parse(getPersistentData('helfer_calendar_entries', '[]')) || [];
        let todoEntries = JSON.parse(getPersistentData('helfer_todo_entries', '[]')) || [];
        let memoryItems = JSON.parse(getPersistentData('helfer_memory', '{}')) || {};
        let savedContacts = JSON.parse(getPersistentData('helfer_contacts', '{}')) || {};

        renderAllLists();
        renderContactList();

        function saveContact() {
            const name = contactNameInput.value.trim();
            const phone = contactPhoneInput.value.trim();
            if (name && phone) {
                savedContacts[name.toLowerCase()] = { originalName: name, phone: phone };
                setPersistentData('helfer_contacts', JSON.stringify(savedContacts));
                contactNameInput.value = '';
                contactPhoneInput.value = '';
                renderContactList();
                connectionStatus.textContent = `Kontakt "${name}" gespeichert.`;
            } else {
                alert('Bitte Name und Telefonnummer eingeben.');
            }
        }

        function deleteContact(key) {
            confirmAction(`Möchtest du den Kontakt "${savedContacts[key]?.originalName || key}" wirklich löschen?`, () => {
                delete savedContacts[key];
                setPersistentData('helfer_contacts', JSON.stringify(savedContacts));
                renderContactList();
            });
        }

        function renderContactList() {
            const keys = Object.keys(savedContacts);
            if (keys.length === 0) {
                contactListDisplay.innerHTML = 'Keine Kontakte gespeichert.';
            } else {
                let html = '<b>Gespeicherte Kontakte:</b><br>';
                keys.forEach(k => {
                    html += `<div class="flex justify-between items-center my-1"><span>• ${savedContacts[k].originalName}: ${savedContacts[k].phone}</span> <button onclick="deleteContact('${k}')" class="text-red-600 font-bold ml-2">Löschen</button></div>`;
                });
                contactListDisplay.innerHTML = html;
            }
        }

        function switchTab(tab) {
            calendarView.classList.add('hidden');
            todoView.classList.add('hidden');
            tabCalendarBtn.className = "flex-1 py-2 rounded-lg font-bold text-sm text-slate-600 transition";
            tabTodoBtn.className = "flex-1 py-2 rounded-lg font-bold text-sm text-slate-600 transition";

            if (tab === 'calendar') {
                calendarView.classList.remove('hidden');
                tabCalendarBtn.className = "flex-1 py-2 rounded-lg font-bold text-sm bg-white text-blue-800 shadow-sm transition";
            } else if (tab === 'todo') {
                todoView.classList.remove('hidden');
                tabTodoBtn.className = "flex-1 py-2 rounded-lg font-bold text-sm bg-white text-blue-800 shadow-sm transition";
            }
        }

        let tokenClient;
        let accessToken = getPersistentData('google_access_token', '');

        function toggleSettings() {
            settingsBox.classList.toggle('hidden');
        }

        function loginWithGoogle() {
            const clientId = getPersistentData('google_client_id', '');
            if (!clientId) {
                alert('Bitte zuerst die Google Client-ID eintragen!');
                return;
            }

            try {
                tokenClient = google.accounts.oauth2.initTokenClient({
                    client_id: clientId,
                    scope: 'https://www.googleapis.com/auth/calendar.events',
                    callback: (response) => {
                        if (response.error) {
                            connectionStatus.textContent = `❌ Fehler: ${response.error}`;
                            return;
                        }
                        accessToken = response.access_token;
                        setPersistentData('google_access_token', accessToken);
                        connectionStatus.textContent = "✅ Mit Google Kalender verbunden!";
                    },
                });
                tokenClient.requestAccessToken();
            } catch (error) {
                connectionStatus.textContent = `❌ Fehler: ${error.message}`;
            }
        }

        let currentAudio = null;

        function speak(text, onComplete) {
            lastSpokenText = text;
            if (currentAudio) {
                currentAudio.pause();
                currentAudio = null;
            }

            const encodedText = encodeURIComponent(text);
            const audioUrl = `https://translate.google.com/translate_tts?ie=UTF-8&q=${encodedText}&tl=de&client=tw-ob`;
            
            currentAudio = new Audio(audioUrl);
            currentAudio.playbackRate = 1.35; 

            currentAudio.play().catch(err => {
                fallbackSpeak(text, onComplete);
            });

            currentAudio.onended = function() {
                currentAudio = null;
                if (onComplete) setTimeout(() => { onComplete(); }, 300);
            };

            currentAudio.onerror = function() {
                currentAudio = null;
                fallbackSpeak(text, onComplete);
            };
        }

        function fallbackSpeak(text, onComplete) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'de-DE';
                utterance.rate = 1.1;
                utterance.onend = () => { if (onComplete) setTimeout(onComplete, 300); };
                window.speechSynthesis.speak(utterance);
            } else {
                if (onComplete) setTimeout(onComplete, 300);
            }
        }

        function repeatLastSpeech() {
            if (lastSpokenText) {
                speak(lastSpokenText);
            } else {
                speak("Es gibt noch nichts vorzulesen.");
            }
        }

        // Keine automatischen Ersetzungen mehr – gesprochener Text wird exakt 1:1 durchgereicht
        function formatSpokenPunctuations(text) {
            return text;
        }

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition = null;
        let isRecording = false;

        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.lang = 'de-DE';
            recognition.interimResults = true;
            recognition.maxAlternatives = 1;

            recognition.onstart = function() {
                isRecording = true;
                statusMessage.textContent = "Höre zu... Bitte sprechen.";
                recordBtn.classList.remove('bg-red-600', 'hover:bg-red-700');
                recordBtn.classList.add('bg-emerald-600', 'hover:bg-emerald-700', 'animate-pulse');
                recordText.textContent = "HÖRE...";
            };

            recognition.onresult = function(event) {
                let interimTranscript = '';
                let finalTranscript = '';

                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    if (event.results[i].isFinal) {
                        finalTranscript += event.results[i][0].transcript;
                    } else {
                        interimTranscript += event.results[i][0].transcript;
                    }
                }

                if (finalTranscript) {
                    const cleanedSpeech = formatSpokenPunctuations(finalTranscript);
                    processUserCommand(cleanedSpeech);
                } else if (interimTranscript) {
                    statusMessage.textContent = `Höre: "${interimTranscript}"`;
                }
            };

            recognition.onerror = function() {
                statusMessage.textContent = "Sprachfehler oder abgebrochen.";
                resetButton();
            };

            recognition.onend = function() {
                isRecording = false;
                resetButton();
            };
        } else {
            statusMessage.textContent = "Keine Spracherkennung im Browser.";
            recordBtn.disabled = true;
        }

        function submitTextFallback() {
            const text = textFallbackInput.value.trim();
            if (!text) return;
            textFallbackInput.value = '';
            processUserCommand(text);
        }

        function processUserCommand(speechResult) {
            statusMessage.textContent = `Erkannt: "${speechResult}"`;
            const lower = speechResult.toLowerCase();
            
            if ((lower.includes("ruf") || lower.includes("anrufen")) && lower.includes("an")) {
                handleCallCommand(lower);
            } else if (lower.includes("was steht heute an") || lower.includes("was liegt heute an") || lower.includes("bevor ich das haus verlasse")) {
                triggerDailyBriefing();
            } else if (lower.includes("was steht auf meiner to-do-liste") || lower.includes("to do liste") || lower.includes("was habe ich auf der liste")) {
                readTodoList();
            } else {
                sendToGroqSmart(speechResult);
            }
        }

        function startListeningAuto() {
            const currentKey = getPersistentData('user_api_key', '');
            if (!currentKey || !recognition) return;
            if (isRecording) return;
            try {
                recognition.start();
            } catch (e) {
                try {
                    recognition.stop();
                    setTimeout(() => recognition.start(), 200);
                } catch (err) {}
            }
        }

        function readTodoList() {
            if (todoEntries.length === 0) {
                speak("Deine To-Do-Liste ist aktuell leer.", () => startListeningAuto());
                statusMessage.textContent = "To-Do-Liste ist leer.";
                return;
            }

            let textToSpeak = "Auf deiner To-Do-Liste stehen folgende Einträge: ";
            todoEntries.forEach((entry, index) => {
                textToSpeak += `Punkt ${index + 1}: ${entry.text}. `;
            });
            
            statusMessage.textContent = "Lese To-Do-Liste vor...";
            speak(textToSpeak, () => startListeningAuto());
        }

        function handleCallCommand(text) {
            let foundContact = null;
            for (let key in savedContacts) {
                if (text.includes(key)) {
                    foundContact = savedContacts[key];
                    break;
                }
            }

            if (foundContact) {
                speak(`Ich rufe ${foundContact.originalName} für dich an.`, () => {
                    window.location.href = `tel:${foundContact.phone}`;
                });
            } else {
                speak("Diesen Kontakt habe ich leider nicht gefunden. Du kannst ihn ganz einfach in den Einstellungen hinzufügen.", () => startListeningAuto());
            }
        }

        function toggleSpeechRecognition() {
            const currentKey = getPersistentData('user_api_key', '');
            if (!currentKey) {
                alert('Bitte hinterlege zuerst deinen Groq API-Key oben über "⚙️ Einstellungen"!');
                settingsBox.classList.remove('hidden');
                return;
            }

            if (!recognition) {
                alert('Spracherkennung wird vom Browser nicht unterstützt.');
                return;
            }

            if (isRecording) {
                recognition.stop();
            } else {
                startListeningAuto();
            }
        }

        function resetButton() {
            isRecording = false;
            recordBtn.classList.remove('bg-emerald-600', 'hover:bg-emerald-700', 'animate-pulse');
            recordBtn.classList.add('bg-red-600', 'hover:bg-red-700');
            recordText.textContent = "SPRECHEN";
        }

        async function getCoordinates() {
            return new Promise((resolve) => {
                if (!navigator.geolocation) {
                    resolve({ lat: 53.5135, lon: 10.4182 });
                    return;
                }
                navigator.geolocation.getCurrentPosition(
                    (position) => { resolve({ lat: position.coords.latitude, lon: position.coords.longitude }); },
                    (error) => { resolve({ lat: 53.5135, lon: 10.4182 }); },
                    { timeout: 5000 }
                );
            });
        }

        async function triggerDailyBriefing() {
            statusMessage.textContent = "Lade Wetter & Briefing...";
            const coords = await getCoordinates();
            let weatherText = "";
            let weatherAdvice = "";
            try {
                const weatherRes = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${coords.lat}&longitude=${coords.lon}&current=temperature_2m,weather_code,wind_speed_10m`);
                if (weatherRes.ok) {
                    const weatherData = await weatherRes.json();
                    const temp = weatherData.current.temperature_2m;
                    const code = weatherData.current.weather_code;
                    const wind = weatherData.current.wind_speed_10m || 0;
                    
                    let condition = "bewölkt";
                    if (code === 0) condition = "klar und sonnig";
                    else if (code >= 1 && code <= 3) condition = "wechselhaft bewölkt";
                    else if (code >= 51 && code <= 67) condition = "regnerisch";
                    else if (code >= 71 && code <= 77) condition = "schneebedeckt";
                    else if (code >= 95) condition = "Gewitter";

                    weatherText = `Das aktuelle Wetter an deinem Standort ist ${condition} bei ${temp} Grad. `;
                    if (code >= 51 && code <= 67) weatherAdvice = "Es ist regnerisch, nimm bitte einen Regenschirm mit! ";
                    else if (temp < 12) weatherAdvice = "Es ist ziemlich frisch draußen, zieh dir am besten eine Jacke an. ";
                    else if (temp > 24) weatherAdvice = "Heute wird es schön warm! ";
                    else if (wind > 30) weatherAdvice = "Es ist windig, nimm lieber eine Jacke mit. ";
                    else weatherAdvice = "Das Wetter ist ganz angenehm. ";
                }
            } catch (e) {}

            const nowBriefing = new Date();
            const currentTimeStr = nowBriefing.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit', timeZone: 'Europe/Berlin' });
            let briefingText = `Guten Tag, ${currentUserName}. Es ist jetzt ${currentTimeStr} Uhr. Hier ist dein kurzer Überblick. ${weatherText} ${weatherAdvice}`;

            const todayStr = nowBriefing.toLocaleDateString('en-CA');
            const todayCalendarEntries = calendarEntries.filter(e => e.isoDate && e.isoDate.startsWith(todayStr));

            if (todayCalendarEntries.length > 0) {
                briefingText += "Deine Termine heute: ";
                todayCalendarEntries.forEach((e, index) => {
                    let timeOnly = "ganztägig";
                    try {
                        const parsedDate = new Date(e.isoDate);
                        if (!isNaN(parsedDate)) {
                            timeOnly = parsedDate.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit', timeZone: 'Europe/Berlin' }) + " Uhr";
                        }
                    } catch (err) {}
                    briefingText += `Termin ${index + 1}: ${e.text}, um ${timeOnly}. `;
                });
            } else {
                briefingText += "Du hast heute keine Termine. ";
            }

            if (todoEntries.length > 0) {
                briefingText += "Offene To-Dos: ";
                todoEntries.forEach(e => { briefingText += `${e.text}. `; });
            }

            statusMessage.textContent = "Fertig.";
            speak(briefingText, () => startListeningAuto());
        }

        async function sendToGroqSmart(text) {
            const key = getPersistentData('user_api_key', '');
            statusMessage.textContent = "Verarbeite...";

            const now = new Date();
            const todayStr = now.toLocaleDateString('en-CA');
            const currentClockTime = now.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit', timeZone: 'Europe/Berlin' });

            const memoryWithDetails = {};
            for (let k in memoryItems) {
                let item = memoryItems[k];
                let loc = typeof item === 'object' ? item.location : item;
                let ts = typeof item === 'object' ? item.timestamp : now.getTime();
                let diffDays = Math.floor((now.getTime() - ts) / (1000 * 60 * 60 * 24));
                let timeDesc = diffDays === 0 ? "heute" : (diffDays === 1 ? "vor 1 Tag" : `vor ${diffDays} Tagen`);
                memoryWithDetails[k] = { location: loc, abgelegt: timeDesc };
            }

            try {
                const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${key}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        model: "openai/gpt-oss-120b", 
                        response_format: { type: "json_object" },
                        messages: [
                            {
                                role: "system",
                                content: `Du bist ${currentUserName}s smarter, absolut natürlicher und menschlicher Alltags-Assistent in Schwarzenbek. 
                                Aktuelles exaktes Datum heute ist ${todayStr}, Uhrzeit ist exakt ${currentClockTime} Uhr.
                                Bisheriges Gedächtnis: ${JSON.stringify(memoryWithDetails)}
                                Kalender: ${JSON.stringify(calendarEntries)}
                                To-Dos: ${JSON.stringify(todoEntries)}

                                WICHTIG FÜR PASSWÖRTER, E-MAILS & ZUGANGSDATEN:
                                - Wenn der Nutzer Zugangsdaten, Benutzername, E-Mail-Adresse oder Passwörter speichert (z.B. "speichere meine Zugangsdaten für Google...", "Meine E-Mail ist...", "Passwort für..."), setze "type" auf "item_store", "item_category" auf "Passwörter", "item_name" auf den Dienst/Namen und "item_location" auf die exakten Daten (z.B. Benutzername + Passwort oder E-Mail-Adresse).
                                - Achte extrem darauf, Zeichen in E-Mail-Adressen und Passwörtern (wie das At-Zeichen "@", Punkte ".", Bindestriche "-", Unterstriche "_") **exakt** so zu übernehmen, wie sie genannt wurden (z.B. schröterdino@googlemail.com). Erfinde keine Leerzeichen.
                                - Die KI soll den Wert bei der Bestätigung ("reply") normal und kurz bestätigen (z.B. "Ist gespeichert!"), ohne den Code oder Punkte mühsam vorzulesen.

                                Gib ein JSON-Objekt zurück mit Feldern: "type" ("chat", "name_change", "item_store", "item_query", "note", "calendar", "calendar_delete"), "new_name", "item_name", "item_location", "item_category", "note_text", "summary", "start_time", "calendar_delete_query", "reply".`
                            },
                            {
                                role: "user",
                                content: text
                            }
                        ]
                    })
                });

                if (!response.ok) throw new Error(`HTTP ${response.status}`);

                const data = await response.json();
                const aiData = JSON.parse(data.choices[0].message.content);

                let finalReply = aiData.reply || "Alles klar!";

                if (aiData.type === 'calendar_delete') {
                    let searchQuery = (aiData.calendar_delete_query || text).toLowerCase();
                    searchQuery = searchQuery.replace(/lösche|termin|den|das|für|am|meinen|meine|bitte/gi, "").trim();
                    
                    let matchedEntry = calendarEntries.find(e => e.text.toLowerCase().includes(searchQuery) || searchQuery.includes(e.text.toLowerCase()));

                    if (!matchedEntry && searchQuery.length > 2) {
                        matchedEntry = calendarEntries.find(e => {
                            let words = e.text.toLowerCase().split(/\s+/);
                            return words.some(w => w.length > 2 && searchQuery.includes(w));
                        });
                    }

                    if (matchedEntry) {
                        confirmAction(`Möchtest du den Termin "${matchedEntry.text}" wirklich löschen?`, async () => {
                            if (matchedEntry.calendarId && accessToken) {
                                try {
                                    await fetch(`https://www.googleapis.com/calendar/v3/calendars/primary/events/${matchedEntry.calendarId}`, {
                                        method: 'DELETE',
                                        headers: { 'Authorization': `Bearer ${accessToken}` }
                                    });
                                } catch (e) {}
                            }
                            calendarEntries = calendarEntries.filter(e => e.id !== matchedEntry.id);
                            setPersistentData('helfer_calendar_entries', JSON.stringify(calendarEntries));
                            renderAllLists();
                            speak("Termin gelöscht.");
                        });
                        finalReply = `Soll ich den Termin ${matchedEntry.text} wirklich löschen?`;
                    } else {
                        finalReply = "Ich habe keinen passenden Termin dazu in deiner Liste gefunden.";
                    }
                }
                else if (aiData.type === 'calendar') {
                    let calendarEventId = null;
                    let fullFormattedDate = new Date().toLocaleString('de-DE', { dateStyle: 'medium', timeStyle: 'short', timeZone: 'Europe/Berlin' });
                    let shortFormattedDate = new Date().toLocaleDateString('de-DE', { day: 'numeric', month: 'long' });
                    let rawIsoTime = aiData.start_time || new Date().toISOString();
                    
                    if (aiData.start_time) {
                        calendarEventId = await createGoogleCalendarEvent(aiData.summary || text, aiData.start_time);
                        const parsedDate = new Date(aiData.start_time);
                        if (!isNaN(parsedDate)) {
                            fullFormattedDate = parsedDate.toLocaleString('de-DE', { dateStyle: 'medium', timeStyle: 'short', timeZone: 'Europe/Berlin' });
                            let timePart = parsedDate.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit', timeZone: 'Europe/Berlin' });
                            shortFormattedDate = `${parsedDate.toLocaleDateString('de-DE', { day: 'numeric', month: 'long' })} um ${timePart} Uhr`;
                        }
                    }

                    calendarEntries.unshift({
                        id: Date.now(),
                        calendarId: calendarEventId,
                        text: aiData.summary || text,
                        date: fullFormattedDate,
                        shortDate: shortFormattedDate,
                        isoDate: rawIsoTime
                    });
                    setPersistentData('helfer_calendar_entries', JSON.stringify(calendarEntries));
                } else if (aiData.type === 'note') {
                    todoEntries.unshift({ id: Date.now(), text: (aiData.note_text || text).replace(/\s+(am|um)\s+.*/gi, '').trim() });
                    setPersistentData('helfer_todo_entries', JSON.stringify(todoEntries));
                } else if (aiData.type === 'item_store' && aiData.item_name && aiData.item_location) {
                    let cleanName = aiData.item_name.toLowerCase();
                    memoryItems[cleanName] = {
                        location: aiData.item_location,
                        timestamp: Date.now(),
                        category: aiData.item_category || "Sonstiges"
                    };
                    setPersistentData('helfer_memory', JSON.stringify(memoryItems));
                }

                if (aiData.type === 'name_change' && aiData.new_name) {
                    currentUserName = aiData.new_name;
                    setPersistentData('user_custom_name', currentUserName);
                    userNameInput.value = currentUserName;
                    updateUserGreeting();
                }

                if (aiData.type === 'item_query' && aiData.item_name) {
                    let cleanQuery = aiData.item_name.toLowerCase();
                    for (let storedKey in memoryItems) {
                        if (cleanQuery.includes(storedKey) || storedKey.includes(cleanQuery)) {
                            let item = memoryItems[storedKey];
                            let matchedName = storedKey.charAt(0).toUpperCase() + storedKey.slice(1);
                            finalReply = item.category === "Passwörter" 
                                ? `Deine Zugangsdaten für ${matchedName} lauten: ${item.location}` 
                                : `Dein ${matchedName} ist ${item.location}.`;
                            break;
                        }
                    }
                }

                statusMessage.textContent = "Fertig.";
                speak(finalReply, () => startListeningAuto());
                renderAllLists();

            } catch (error) {
                console.error(error);
                statusMessage.textContent = error.message;
                speak("Es gab einen Fehler.", () => startListeningAuto());
            }
        }

        async function createGoogleCalendarEvent(summary, startTimeStr) {
            if (!accessToken) return null;
            const startDate = new Date(startTimeStr);
            const endDate = new Date(startDate.getTime() + 60 * 60 * 1000);
            const event = {
                summary: summary,
                start: { dateTime: startDate.toISOString() },
                end: { dateTime: endDate.toISOString() }
            };
            try {
                const res = await fetch('https://www.googleapis.com/calendar/v3/calendars/primary/events', {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${accessToken}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify(event)
                });
                if (res.ok) {
                    const data = await res.json();
                    return data.id;
                }
            } catch (e) {}
            return null;
        }

        function deleteCalendarEntry(id, calendarId) {
            confirmAction("Möchtest du diesen Termin wirklich löschen?", async () => {
                if (calendarId && calendarId !== 'null' && accessToken) {
                    try {
                        await fetch(`https://www.googleapis.com/calendar/v3/calendars/primary/events/${calendarId}`, {
                            method: 'DELETE',
                            headers: { 'Authorization': `Bearer ${accessToken}` }
                        });
                    } catch (e) {}
                }
                calendarEntries = calendarEntries.filter(e => e.id !== id);
                setPersistentData('helfer_calendar_entries', JSON.stringify(calendarEntries));
                renderAllLists();
                speak("Termin gelöscht.");
            });
        }

        function deleteTodoEntry(id) {
            confirmAction("Möchtest du dieses To-Do wirklich löschen?", () => {
                todoEntries = todoEntries.filter(e => e.id !== id);
                setPersistentData('helfer_todo_entries', JSON.stringify(todoEntries));
                renderAllLists();
                speak("Erledigt.");
            });
        }

        function deleteMemoryItem(key) {
            confirmAction(`Möchtest du "${key}" wirklich aus dem Gedächtnis löschen?`, () => {
                delete memoryItems[key];
                setPersistentData('helfer_memory', JSON.stringify(memoryItems));
                renderAllLists();
                speak("Gelöscht.");
            });
        }

        function togglePasswordVisibility(key) {
            visiblePasswords[key] = !visiblePasswords[key];
            renderAllLists();
        }

        function clearAllMemory() {
            memoryItems = {};
            localStorage.removeItem('helfer_memory');
            sessionStorage.removeItem('helfer_memory');
            visiblePasswords = {};
            renderAllLists();
            speak("Gedächtnis geleert.");
        }

        function renderAllLists() {
            if (calendarEntries.length === 0) {
                calendarList.innerHTML = '<li class="text-slate-500">Keine Termine eingetragen.</li>';
            } else {
                calendarList.innerHTML = '';
                calendarEntries.forEach(entry => {
                    const li = document.createElement('li');
                    li.className = "bg-slate-50 p-3 rounded-xl border border-slate-100 flex justify-between items-center text-base";
                    li.innerHTML = `
                        <div>
                            <span>📅 ${entry.text}</span>
                            <div class="text-xs text-slate-400">${entry.date}</div>
                        </div>
                        <button onclick="deleteCalendarEntry(${entry.id}, '${entry.calendarId || ''}')" class="bg-red-500 hover:bg-red-600 text-white px-3 py-1 rounded-lg text-sm font-semibold ml-2">
                            Löschen
                        </button>
                    `;
                    calendarList.appendChild(li);
                });
            }

            if (todoEntries.length === 0) {
                todoList.innerHTML = '<li class="text-slate-500">Keine offenen To-Dos.</li>';
            } else {
                todoList.innerHTML = '';
                todoEntries.forEach(entry => {
                    const li = document.createElement('li');
                    li.className = "bg-slate-50 p-3 rounded-xl border border-slate-100 flex justify-between items-center text-base";
                    li.innerHTML = `
                        <div>
                            <span>📝 ${entry.text}</span>
                        </div>
                        <button onclick="deleteTodoEntry(${entry.id})" class="bg-emerald-500 hover:bg-emerald-600 text-white px-3 py-1 rounded-lg text-sm font-semibold ml-2">
                            Erledigt
                        </button>
                    `;
                    todoList.appendChild(li);
                });
            }

            const categories = ["Passwörter", "Flur", "Schlafzimmer", "Wohnzimmer", "Badezimmer", "Sonstiges"];
            const grouped = {};
            categories.forEach(c => grouped[c] = []);

            for (let key in memoryItems) {
                let item = memoryItems[key];
                let loc = typeof item === 'object' ? item.location : item;
                let cat = (typeof item === 'object' && item.category) ? item.category : "Sonstiges";
                if (!grouped[cat]) cat = "Sonstiges";
                grouped[cat].push({ key: key, location: loc });
            }

            let catHtml = '';
            let hasAnyItems = false;

            categories.forEach(cat => {
                let itemsInCat = grouped[cat];
                if (itemsInCat && itemsInCat.length > 0) {
                    hasAnyItems = true;
                    catHtml += `<div class="border border-slate-200 rounded-xl p-3 bg-slate-50 mb-2">
                        <h3 class="font-bold text-amber-900 mb-2">📌 ${cat}</h3>
                        <ul class="space-y-1">`;
                    
                    itemsInCat.forEach(i => {
                        let capitalizedName = i.key.charAt(0).toUpperCase() + i.key.slice(1);
                        
                        if (cat === "Passwörter") {
                            let isVisible = visiblePasswords[i.key];
                            let displayVal = isVisible ? i.location : "••••••••";
                            let btnLabel = isVisible ? "Verbergen" : "Anzeigen";
                            
                            catHtml += `<li class="flex justify-between items-center text-xs py-1 border-b border-slate-200 last:border-none">
                                <div>• <b>${capitalizedName}</b>: <span class="font-mono bg-white px-1 py-0.5 rounded border border-slate-200">${displayVal}</span></div>
                                <div class="flex items-center gap-2">
                                    <button onclick="togglePasswordVisibility('${i.key}')" class="text-blue-600 font-bold">${btnLabel}</button>
                                    <button onclick="deleteMemoryItem('${i.key}')" class="text-red-600 font-bold">Löschen</button>
                                </div>
                            </li>`;
                        } else {
                            catHtml += `<li class="flex justify-between items-center text-xs py-1 border-b border-slate-200 last:border-none">
                                <span>• <b>${capitalizedName}</b>: ${i.location}</span>
                                <button onclick="deleteMemoryItem('${i.key}')" class="text-red-600 font-bold ml-2">Löschen</button>
                            </li>`;
                        }
                    });

                    catHtml += `</ul></div>`;
                }
            });

            if (!hasAnyItems) {
                categoryContainer.innerHTML = '<p class="text-slate-500 text-xs">Keine Gegenstände oder Passwörter gespeichert.</p>';
            } else {
                categoryContainer.innerHTML = catHtml;
            }
        }
    </script>
</body>
