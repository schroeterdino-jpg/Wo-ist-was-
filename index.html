    <!-- JavaScript -->
    <script>
        // PWA Service Worker Registrierung mit Cache-Busting
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => {
                        reg.update();
                        console.log('Service Worker aktiv!', reg);
                    })
                    .catch(err => console.log('SW Fehler:', err));
            });
        }

        // Sektionen umschalten (Tabs)
        function switchSection(sectionId) {
            const sections = ['speak', 'today', 'reminders', 'todos', 'memory', 'shopping', 'settings'];
            sections.forEach(s => {
                const el = document.getElementById(`sec-${s}`);
                if (el) el.classList.add('hidden');
                const navBtn = document.getElementById(`nav${s.charAt(0).toUpperCase() + s.slice(1)}`);
                if (navBtn) {
                    navBtn.className = "flex-1 py-2 px-2 rounded-lg text-slate-600 hover:bg-slate-100 transition";
                }
            });

            const targetSec = document.getElementById(`sec-${sectionId}`);
            if (targetSec) targetSec.classList.remove('hidden');
            
            const activeNav = document.getElementById(`nav${sectionId.charAt(0).toUpperCase() + sectionId.slice(1)}`);
            if (activeNav) {
                activeNav.className = "flex-1 py-2 px-2 rounded-lg bg-blue-600 text-white shadow transition";
            }
        }

        const recordBtn = document.getElementById('recordBtn');
        const recordText = document.getElementById('recordText');
        const statusMessage = document.getElementById('statusMessage');
        const calendarList = document.getElementById('calendarList');
        const todoList = document.getElementById('todoList');
        const reminderList = document.getElementById('reminderList');
        const shoppingList = document.getElementById('shoppingList');
        const categoryContainer = document.getElementById('categoryContainer');
        
        const apiKeyInput = document.getElementById('apiKeyInput');
        const googleClientIdInput = document.getElementById('googleClientIdInput');
        const userNameInput = document.getElementById('userNameInput');
        const userNameDisplay = document.getElementById('userNameDisplay');
        const connectionStatus = document.getElementById('connectionStatus');
        
        const contactNameInput = document.getElementById('contactNameInput');
        const contactPhoneInput = document.getElementById('contactPhoneInput');
        const contactListDisplay = document.getElementById('contactListDisplay');

        function getPersistentData(key, defaultValue) {
            let val = localStorage.getItem(key);
            if (!val || val === "null" || val === "undefined") val = sessionStorage.getItem(key);
            return (!val || val === "null" || val === "undefined") ? defaultValue : val;
        }

        function setPersistentData(key, value) {
            try { localStorage.setItem(key, value); } catch (e) {}
            try { sessionStorage.setItem(key, value); } catch (e) {}
        }

        let currentUserName = getPersistentData('user_custom_name', 'Dino');
        if (userNameInput) userNameInput.value = currentUserName;
        updateUserGreeting();

        let savedKey = getPersistentData('user_api_key', '');
        if (savedKey && apiKeyInput) apiKeyInput.value = savedKey;

        const DEFAULT_CLIENT_ID = '399573320370-qka01ghj0s88eoair7lla665cbj10o4g.apps.googleusercontent.com';
        let savedClientId = getPersistentData('google_client_id', DEFAULT_CLIENT_ID);
        if (!savedClientId || savedClientId === "null") {
            savedClientId = DEFAULT_CLIENT_ID;
            setPersistentData('google_client_id', savedClientId);
        }
        if (googleClientIdInput) googleClientIdInput.value = savedClientId;

        if (userNameInput) {
            userNameInput.addEventListener('input', () => {
                currentUserName = userNameInput.value.trim() || "Dino";
                setPersistentData('user_custom_name', currentUserName);
                updateUserGreeting();
            });
        }

        if (apiKeyInput) {
            apiKeyInput.addEventListener('input', () => {
                setPersistentData('user_api_key', apiKeyInput.value.trim());
                if (connectionStatus) connectionStatus.textContent = "API-Key gespeichert.";
            });
        }

        if (googleClientIdInput) {
            googleClientIdInput.addEventListener('input', () => {
                const val = googleClientIdInput.value.trim() || DEFAULT_CLIENT_ID;
                setPersistentData('google_client_id', val);
                if (connectionStatus) connectionStatus.textContent = "Client-ID gespeichert.";
            });
        }

        function updateUserGreeting() {
            if (userNameDisplay) userNameDisplay.textContent = `Hallo, ${currentUserName}!`;
        }

        let calendarEntries = JSON.parse(getPersistentData('helfer_calendar_entries', '[]')) || [];
        let todoEntries = JSON.parse(getPersistentData('helfer_todo_entries', '[]')) || [];
        let reminderEntries = JSON.parse(getPersistentData('helfer_reminders', '[]')) || [];
        let shoppingEntries = JSON.parse(getPersistentData('helfer_shopping', '[]')) || [];
        let memoryItems = JSON.parse(getPersistentData('helfer_memory', '{}')) || {};
        let savedContacts = JSON.parse(getPersistentData('helfer_contacts', '{}')) || {};

        renderAllLists();
        renderContactList();

        function requestNotificationPermission() {
            if ('Notification' in window) {
                Notification.requestPermission().then(perm => {
                    if (perm === 'granted') alert('Benachrichtigungen aktiviert!');
                });
            }
        }

        // Hintergrund-Check für fällige Erinnerungen (läuft minütlich)
        setInterval(() => {
            if (reminderEntries.length === 0) return;
            const now = new Date();
            reminderEntries.forEach(rem => {
                const remTime = new Date(rem.time);
                if (!rem.triggered && remTime <= now) {
                    rem.triggered = true;
                    setPersistentData('helfer_reminders', JSON.stringify(reminderEntries));
                    
                    if ('Notification' in window && Notification.permission === 'granted') {
                        new Notification("Erinnerung von deinem Helfer", { body: rem.text, icon: './dino.png' });
                    }
                    speak(`Erinnerung: ${rem.text}`);
                }
            });
        }, 30000);

        function addManualReminder() {
            const textEl = document.getElementById('manualReminderText');
            const timeEl = document.getElementById('manualReminderTime');
            if (!textEl || !timeEl) return;
            const text = textEl.value.trim();
            const time = timeEl.value;
            if (text && time) {
                reminderEntries.push({ id: Date.now(), text, time, triggered: false });
                setPersistentData('helfer_reminders', JSON.stringify(reminderEntries));
                textEl.value = '';
                timeEl.value = '';
                renderAllLists();
            }
        }

        function addManualTodo() {
            const inputEl = document.getElementById('manualTodoInput');
            if (!inputEl) return;
            const val = inputEl.value.trim();
            if (val) {
                todoEntries.unshift({ id: Date.now(), text: val, createdDate: 'Manuell' });
                setPersistentData('helfer_todo_entries', JSON.stringify(todoEntries));
                inputEl.value = '';
                renderAllLists();
            }
        }

        function addManualShoppingItem() {
            const inputEl = document.getElementById('manualShoppingInput');
            if (!inputEl) return;
            const val = inputEl.value.trim();
            if (val) {
                shoppingEntries.unshift({ id: Date.now(), text: val });
                setPersistentData('helfer_shopping', JSON.stringify(shoppingEntries));
                inputEl.value = '';
                renderAllLists();
            }
        }

        function saveContact() {
            const name = contactNameInput.value.trim();
            const phone = contactPhoneInput.value.trim();
            if (name && phone) {
                savedContacts[name.toLowerCase()] = { originalName: name, phone: phone };
                setPersistentData('helfer_contacts', JSON.stringify(savedContacts));
                contactNameInput.value = '';
                contactPhoneInput.value = '';
                renderContactList();
            }
        }

        function deleteContact(key) {
            delete savedContacts[key];
            setPersistentData('helfer_contacts', JSON.stringify(savedContacts));
            renderContactList();
        }

        function renderContactList() {
            if (!contactListDisplay) return;
            const keys = Object.keys(savedContacts);
            contactListDisplay.innerHTML = keys.length === 0 ? 'Keine Kontakte.' : keys.map(k => `<div class="flex justify-between items-center"><span>${savedContacts[k].originalName}: ${savedContacts[k].phone}</span><button onclick="deleteContact('${k}')" class="text-red-600 font-bold">Löschen</button></div>`).join('');
        }

        let tokenClient;
        let accessToken = getPersistentData('google_access_token', '');

        window.addEventListener('load', () => {
            if (accessToken) {
                if (connectionStatus) connectionStatus.textContent = "✅ Verbunden (Sitzung aktiv)";
                fetchGoogleCalendarEvents();
            } else {
                if (connectionStatus) connectionStatus.textContent = "Nicht verbunden. Klicke auf Verbinden.";
            }
        });

        function loginWithGoogle(silent = false) {
            const clientId = getPersistentData('google_client_id', DEFAULT_CLIENT_ID);
            if (!clientId) { alert('Client-ID fehlt!'); return; }
            
            tokenClient = google.accounts.oauth2.initTokenClient({
                client_id: clientId,
                scope: 'https://www.googleapis.com/auth/calendar.events https://www.googleapis.com/auth/calendar.readonly',
                callback: (response) => {
                    if (response.access_token) {
                        accessToken = response.access_token;
                        setPersistentData('google_access_token', accessToken);
                        if (connectionStatus) connectionStatus.textContent = "✅ Verbunden!";
                        fetchGoogleCalendarEvents();
                    }
                }
            });
            tokenClient.requestAccessToken({ prompt: silent ? '' : 'consent' });
        }

        async function fetchGoogleCalendarEvents() {
            if (!accessToken) return;
            const nowIso = new Date().toISOString();
            const url = `https://www.googleapis.com/calendar/v3/calendars/primary/events?timeMin=${nowIso}&singleEvents=true&orderBy=startTime`;
            try {
                const res = await fetch(url, { headers: { 'Authorization': `Bearer ${accessToken}` } });
                if (res.status === 401) {
                    loginWithGoogle(true);
                    return;
                }
                if (res.ok) {
                    const data = await res.json();
                    if (data.items) {
                        calendarEntries = data.items.map(item => ({
                            id: item.id,
                            text: item.summary || 'Termin',
                            date: new Date(item.start.dateTime || item.start.date).toLocaleString('de-DE', { dateStyle: 'medium', timeStyle: 'short' }),
                            isoDate: item.start.dateTime || item.start.date
                        }));
                        setPersistentData('helfer_calendar_entries', JSON.stringify(calendarEntries));
                        renderAllLists();
                    }
                }
            } catch (e) {}
        }

        async function deleteCalendarEntry(id) {
            if (accessToken && typeof id === 'string' && id.length > 10) {
                const url = `https://www.googleapis.com/calendar/v3/calendars/primary/events/${id}`;
                try {
                    await fetch(url, {
                        method: 'DELETE',
                        headers: { 'Authorization': `Bearer ${accessToken}` }
                    });
                } catch (e) {
                    console.error("Fehler beim Löschen im Google Kalender", e);
                }
            }

            calendarEntries = calendarEntries.filter(e => e.id !== id);
            setPersistentData('helfer_calendar_entries', JSON.stringify(calendarEntries));
            renderAllLists();
        }

        async function fetchWeatherData() {
            return new Promise((resolve) => {
                if (!navigator.geolocation) {
                    resolve({ fehler: "Standortbestimmung nicht unterstützt." });
                    return;
                }
                navigator.geolocation.getCurrentPosition(async (position) => {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;
                    try {
                        const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,precipitation,weather_code,wind_speed_10m`);
                        const data = await res.json();
                        resolve({
                            temperatur: data.current.temperature_2m,
                            einheit: data.current_units.temperature_2m,
                            niederschlag: data.current.precipitation,
                            windstärke: data.current.wind_speed_10m,
                            wettercode: data.current.weather_code,
                            koordinaten: { lat, lon }
                        });
                    } catch (e) {
                        resolve({ fehler: "Wetterdaten konnten nicht geladen werden." });
                    }
                }, () => {
                    resolve({ fehler: "Standortzugriff verweigert." });
                }, { timeout: 10000 });
            });
        }

        let currentAudio = null;
        function speak(text, onComplete) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'de-DE';
                utterance.rate = 1.15;
                utterance.onend = () => { if (onComplete) onComplete(); };
                window.speechSynthesis.speak(utterance);
            } else {
                if (currentAudio) { currentAudio.pause(); currentAudio = null; }
                currentAudio = new Audio(`https://translate.google.com/translate_tts?ie=UTF-8&q=${encodeURIComponent(text)}&tl=de&client=tw-ob`);
                currentAudio.playbackRate = 1.35;
                currentAudio.play().catch(() => {});
                currentAudio.onended = () => { currentAudio = null; if (onComplete) onComplete(); };
            }
        }

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition = null;
        let isRecording = false;

        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.lang = 'de-DE';
            recognition.onstart = () => {
                isRecording = true;
                if (statusMessage) statusMessage.textContent = "Höre zu...";
                if (recordBtn) {
                    recordBtn.classList.replace('bg-red-600', 'bg-emerald-600');
                    recordBtn.classList.add('animate-pulse');
                }
                if (recordText) recordText.textContent = "HÖRE...";
            };
            recognition.onresult = (event) => {
                const text = event.results[0][0].transcript;
                if (statusMessage) statusMessage.textContent = `Erkannt: "${text}"`;
                sendToGroqSmart(text);
            };
            recognition.onerror = () => resetButton();
            recognition.onend = () => resetButton();
        }

        function toggleSpeechRecognition() {
            if (!getPersistentData('user_api_key', '')) {
                alert('Bitte Groq API-Key in den Einstellungen hinterlegen!');
                switchSection('settings');
                return;
            }
            if (!recognition) {
                alert('Spracherkennung wird von diesem Browser leider nicht unterstützt.');
                return;
            }
            if (isRecording) recognition.stop();
            else recognition.start();
        }

        function resetButton() {
            isRecording = false;
            if (recordBtn) {
                recordBtn.classList.replace('bg-emerald-600', 'bg-red-600');
                recordBtn.classList.remove('animate-pulse');
            }
            if (recordText) recordText.textContent = "SPRECHEN";
        }

        async function triggerDailyBriefing() {
            const timeStr = new Date().toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
            let text = `Guten Tag ${currentUserName}. Es ist ${timeStr} Uhr. `;
            text += calendarEntries.length > 0 ? `Du hast ${calendarEntries.length} anstehende Termine. ` : "Du hast heute keine Termine. ";
            text += todoEntries.length > 0 ? `Es gibt noch ${todoEntries.length} offene Aufgaben. ` : "";
            text += reminderEntries.length > 0 ? `Du hast ${reminderEntries.length} aktive Erinnerungen. ` : "";
            
            if (statusMessage) statusMessage.textContent = "Hole Wetter...";
            const weather = await fetchWeatherData();
            if (!weather.fehler) {
                text += `Aktuell hast du ${weather.temperatur} Grad. `;
                if (weather.niederschlag > 0) {
                    text += "Es regnet aktuell, denk an einen Regenschirm! ";
                } else {
                    text += "Es sieht nach trockenem Wetter aus. ";
                }
            }

            if (statusMessage) statusMessage.textContent = "Briefing aktiv.";
            speak(text);
        }

        async function sendToGroqSmart(text) {
            const key = getPersistentData('user_api_key', '');
            if (statusMessage) statusMessage.textContent = "Prüfe Wetter & Daten...";

            let weatherInfo = null;
            const lowerText = text.toLowerCase();
            if (lowerText.includes('wetter') || lowerText.includes('regenschirm') || lowerText.includes('regen') || lowerText.includes('draußen')) {
                weatherInfo = await fetchWeatherData();
            }

            const contextData = {
                gedächtnis: memoryItems,
                kontakte: savedContacts,
                termine: calendarEntries,
                wetter: weatherInfo
            };

            try {
                const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${key}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        model: "openai/gpt-oss-120b",
                        response_format: { type: "json_object" },
                        messages: [
                            {
                                role: "system",
                                content: `Du bist ${currentUserName}s smarter, persönlicher Alltags-Assistent und digitales Langzeitgedächtnis. Aktueller Kontext: ${JSON.stringify(contextData)}.
                                Analysiere den Sprachbefehl des Benutzers und gib ein JSON-Objekt zurück mit:
                                - type: "chat", "memory_store", "memory_query", "todo", "calendar", "reminder", "shopping", "call", "weather"
                                - memory_key, memory_value
                                - todo_text
                                - shopping_item
                                - reminder_text, reminder_time
                                - call_contact
                                - reply: Natürliche, menschliche Antwort auf Deutsch, die dem Benutzer direkt vorgelesen wird. Beziehe Wetterdaten (Temperatur, Niederschlag) aktiv mit ein, wenn danach gefragt wird.`
                            },
                            { role: "user", content: text }
                        ]
                    })
                });

                const data = await res.json();
                const ai = JSON.parse(data.choices[0].message.content);

                if (ai.type === 'shopping' && ai.shopping_item) {
                    shoppingEntries.unshift({ id: Date.now(), text: ai.shopping_item });
                    setPersistentData('helfer_shopping', JSON.stringify(shoppingEntries));
                } else if (ai.type === 'todo' && ai.todo_text) {
                    todoEntries.unshift({ id: Date.now(), text: ai.todo_text, createdDate: 'Per Sprache' });
                    setPersistentData('helfer_todo_entries', JSON.stringify(todoEntries));
                } else if (ai.type === 'memory_store' && ai.memory_key) {
                    memoryItems[ai.memory_key.toLowerCase()] = ai.memory_value || "gespeichert";
                    setPersistentData('helfer_memory', JSON.stringify(memoryItems));
                } else if (ai.type === 'reminder' && ai.reminder_text) {
                    reminderEntries.push({ id: Date.now(), text: ai.reminder_text, time: ai.reminder_time || new Date(Date.now() + 3600000).toISOString(), triggered: false });
                    setPersistentData('helfer_reminders', JSON.stringify(reminderEntries));
                } else if (ai.type === 'call' && ai.call_contact) {
                    const foundKey = Object.keys(savedContacts).find(k => k.includes(ai.call_contact.toLowerCase()));
                    if (foundKey) {
                        window.location.href = `tel:${savedContacts[foundKey].phone}`;
                    }
                }

                renderAllLists();
                speak(ai.reply || "Erledigt.");
                if (statusMessage) statusMessage.textContent = "Fertig.";
            } catch (e) {
                speak("Entschuldigung, da gab es einen Fehler bei der Verbindung.");
            }
        }

        function deleteTodoEntry(id) {
            todoEntries = todoEntries.filter(e => e.id !== id);
            setPersistentData('helfer_todo_entries', JSON.stringify(todoEntries));
            renderAllLists();
        }
        function deleteShoppingEntry(id) {
            shoppingEntries = shoppingEntries.filter(e => e.id !== id);
            setPersistentData('helfer_shopping', JSON.stringify(shoppingEntries));
            renderAllLists();
        }
        function deleteReminderEntry(id) {
            reminderEntries = reminderEntries.filter(e => e.id !== id);
            setPersistentData('helfer_reminders', JSON.stringify(reminderEntries));
            renderAllLists();
        }
        function deleteMemoryItem(key) {
            delete memoryItems[key];
            setPersistentData('helfer_memory', JSON.stringify(memoryItems));
            renderAllLists();
        }
        function clearAllMemory() {
            memoryItems = {};
            localStorage.removeItem('helfer_memory');
            renderAllLists();
        }

        function renderAllLists() {
            if (calendarList) calendarList.innerHTML = calendarEntries.length === 0 ? '<li class="text-slate-500">Keine Termine.</li>' : calendarEntries.map(e => `<li class="flex justify-between items-center bg-slate-50 p-3 rounded-xl border"><span>📅 ${e.text} (${e.date})</span><button onclick="deleteCalendarEntry('${e.id}')" class="text-red-600 font-bold text-xs">Löschen</button></li>`).join('');
            if (todoList) todoList.innerHTML = todoEntries.length === 0 ? '<li class="text-slate-500">Keine offenen Aufgaben.</li>' : todoEntries.map(e => `<li class="flex justify-between items-center bg-slate-50 p-3 rounded-xl border"><span>📝 ${e.text}</span><button onclick="deleteTodoEntry(${e.id})" class="text-emerald-600 font-bold text-xs">Erledigt</button></li>`).join('');
            if (shoppingList) shoppingList.innerHTML = shoppingEntries.length === 0 ? '<li class="text-slate-500">Liste ist leer.</li>' : shoppingEntries.map(e => `<li class="flex justify-between items-center bg-slate-50 p-3 rounded-xl border"><span>🛒 ${e.text}</span><button onclick="deleteShoppingEntry(${e.id})" class="text-emerald-600 font-bold text-xs">Gekauft</button></li>`).join('');
            if (reminderList) reminderList.innerHTML = reminderEntries.length === 0 ? '<li class="text-slate-500">Keine Erinnerungen.</li>' : reminderEntries.map(e => `<li class="flex justify-between items-center bg-slate-50 p-3 rounded-xl border"><span>🔔 ${e.text} (${new Date(e.time).toLocaleString('de-DE', {dateStyle:'short', timeStyle:'short'})})</span><button onclick="deleteReminderEntry(${e.id})" class="text-red-600 font-bold text-xs">Löschen</button></li>`).join('');

            if (categoryContainer) {
                const memKeys = Object.keys(memoryItems);
                categoryContainer.innerHTML = memKeys.length === 0 ? '<p class="text-slate-500 text-xs">Noch nichts im Gedächtnis gespeichert.</p>' : memKeys.map(k => `<div class="flex justify-between items-center text-xs py-1 border-b"><span>• <b>${k}</b>: ${memoryItems[k]}</span><button onclick="deleteMemoryItem('${k}')" class="text-red-600 font-bold">Löschen</button></div>`).join('');
            }
        }
    </script>
