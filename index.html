<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sprachassistent</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .card {
            background: white;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .card h3 {
            margin-top: 0;
            color: #1a237e;
            font-size: 16px;
        }
        .mic-btn {
            background-color: #d32f2f;
            color: white;
            border: none;
            padding: 20px;
            border-radius: 50px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 4px 10px rgba(211, 47, 47, 0.3);
        }
        .briefing-btn {
            background-color: #3f51b5;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
        }
        .delete-all-btn {
            background-color: #d32f2f;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
        }
        p {
            color: #555;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div class="container">
    <button class="mic-btn" onclick="startListening()">
        🎤 SPRECHEN
    </button>

    <button class="briefing-btn" onclick="getBriefing()">
        📋 Was steht heute an? (Briefing)
    </button>

    <!-- HINWEIS: Die Antwort des Assistenten wurde hier komplett entfernt -->

    <div class="card">
        <h3>📅 Kalender-Termine:</h3>
        <p id="termin-status">Keine Termine eingetragen.</p>
    </div>

    <div class="card">
        <h3>📝 To-Dos & Notizen:</h3>
        <p id="todo-status">Keine offenen To-Dos.</p>
    </div>

    <!-- Gemerkte Sachen mit globalem Löschbutton (ohne Einzelliste) -->
    <div class="card">
        <h3>📌 Gemerkte Sachen:</h3>
        <p id="gemerkt-status">Keine gemerkten Sachen vorhanden.</p>
        <button class="delete-all-btn" onclick="deleteAllGemerkteSachen()">Gemerkte Sachen komplett löschen</button>
    </div>
</div>

<script>
    function speakText(text) {
        if ('speechSynthesis' in window) {
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'de-DE';
            window.speechSynthesis.speak(utterance);
        }
    }

    function startListening() {
        // Beispiel, bei dem der korrigierte Begriff "Portemonnaie" gesprochen wird
        const antwort = "Kein Problem! Dein Portemonnaie liegt in der Vitrine.";
        speakText(antwort);
    }

    function getBriefing() {
        const briefingText = "Guten Tag! Heute stehen keine neuen Termine an.";
        speakText(briefingText);
    }

    function deleteAllGemerkteSachen() {
        // Löscht/Leert ausschließlich die gemerkten Sachen
        document.getElementById('gemerkt-status').innerText = "Keine gemerkten Sachen vorhanden.";
        
        // Falls du hierfür einen Speicher nutzt, z.B. localStorage:
        // localStorage.removeItem('gemerkteSachen');
    }
</script>

</body>
</html>
