<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mein Helfer – Sprachassistent</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Identity Services (OAuth / Login) -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        body { font-size: 1.25rem; }
    </style>
</head>
<body class="bg-slate-100 text-slate-900 min-h-screen flex flex-col justify-between">

    <!-- Kopfbereich -->
    <header class="bg-blue-700 text-white p-6 text-center shadow-md relative">
        <div class="flex justify-between items-center max-w-md mx-auto">
            <div></div>
            <div>
                <h1 class="text-3xl font-bold">Mein Alltags-Helfer</h1>
                <p id="userNameDisplay" class="text-lg text-blue-100 mt-1">Hallo, Dino!</p>
            </div>
            <button onclick="toggleSettings()" class="bg-blue-800 hover:bg-blue-900 text-white px-3 py-2 rounded-lg text-sm shadow">
                ⚙️ Einstellungen
            </button>
        </div>
    </header>

    <!-- Einstellungs-Box -->
    <div id="settingsBox" class="hidden bg-amber-50 border-b border-amber-200 p-4 shadow-inner">
        <div class="container mx-auto max-w-md space-y-4">
            <div>
                <label class="block text-sm font-bold text-amber-900 mb-1">Wie soll ich dich nennen?:</label>
                <div class="flex gap-2">
                    <input type="text" id="userNameInput" placeholder="Dein Name..." class="flex-grow p-2 border border-amber-300 rounded-lg text-base">
                    <button onclick="saveUserNameSetting()" class="bg-amber-600 hover:bg-amber-700 text-white px-4 py-2 rounded-lg text-base font-semibold">Speichern</button>
                </div>
            </div>

            <div>
                <label class="block text-sm font-bold text-amber-900 mb-1">Groq API-Key (gsk_...):</label>
                <div class="flex gap-2">
                    <input type="password" id="apiKeyInput" placeholder="gsk_..." class="flex-grow p-2 border border-amber-300 rounded-lg text-base">
                    <button onclick="saveApiKey()" class="bg-amber-600 hover:bg-amber-700 text-white px-4 py-2 rounded-lg text-base font-semibold">Speichern</button>
                </div>
            </div>

            <div>
                <label class="block text-sm font-bold text-amber-900 mb-1">Google Client-ID:</label>
                <div class="flex gap-2">
                    <input type="text" id="googleClientIdInput" placeholder="Client ID..." class="flex-grow p-2 border border-amber-300 rounded-lg text-base">
                    <button onclick="saveGoogleClientId()" class="bg-amber-600 hover:bg-amber-700 text-white px-4 py-2 rounded-lg text-base font-semibold">Speichern</button>
                </div>
            </div>

            <!-- Kontakte für Schnell-Anruf -->
            <div class="border-t border-amber-200 pt-3">
                <label class="block text-sm font-bold text-amber-900 mb-1">📞 Schnell-Anruf Kontakte:</label>
                <div class="flex gap-2 mb-2">
                    <input type="text" id="contactNameInput" placeholder="Name (z.B. Simone)" class="w-1/2 p-2 border border-amber-300 rounded-lg text-base">
                    <input type="text" id="contactPhoneInput" placeholder="Nummer..." class="w-1/2 p-2 border border-amber-300 rounded-lg text-base">
                </div>
                <button onclick="saveContact()" class="w-full bg-amber-600 hover:bg-amber-700 text-white py-2 rounded-lg text-base font-semibold">Kontakt hinzufügen</button>
                <div id="contactListDisplay" class="mt-2 text-xs text-amber-900 space-y-1"></div>
            </div>

            <div class="flex flex-col gap-2 border-t border-amber-200 pt-3">
                <button onclick="loginWithGoogle()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-2 rounded-lg text-sm font-medium flex items-center justify-center gap-2">
                    📅 Mit Google Kalender verbinden
                </button>
            </div>
            <p id="connectionStatus" class="text-xs text-amber-800 mt-2 font-medium break-all"></p>
        </div>
    </div>

    <!-- Hauptbereich -->
    <main class="container mx-auto p-4 max-w-md flex-grow flex flex-col justify-center space-y-6">

        <!-- Mikrofon-Button & Tages-Briefing -->
        <div class="flex flex-col items-center space-y-4">
            <button id="recordBtn" onclick="toggleSpeechRecognition()" class="w-40 h-40 bg-red-600 hover:bg-red-700 text-white rounded-full flex flex-col items-center justify-center shadow-2xl transition transform active:scale-95 border-4 border-white cursor-pointer">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-20 w-20 mb-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z" />
                </svg>
                <span id="recordText" class="text-sm font-semibold tracking-wide">SPRECHEN</span>
            </button>
            <p id="statusMessage" class="text-center font-medium text-slate-700 h-6">Drücken und sprechen...</p>

            <button onclick="triggerDailyBriefing()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-3 px-4 rounded-xl shadow-md font-bold text-lg flex items-center justify-center gap-2">
                📋 Was steht heute an? (Briefing)
            </button>
        </div>

        <!-- Reiter-Navigation -->
        <div class="flex bg-slate-200 p-1 rounded-xl">
            <button id="tabCalendarBtn" onclick="switchTab('calendar')" class="flex-1 py-2 rounded-lg font-bold text-base bg-white text-blue-800 shadow-sm transition">📅 Termine</button>
            <button id="tabTodoBtn" onclick="switchTab('todo')" class="flex-1 py-2 rounded-lg font-bold text-base text-slate-600 transition">📝 To-Dos</button>
        </div>

        <!-- Ansicht: Kalender-Termine -->
        <div id="calendarView" class="bg-white p-5 rounded-2xl shadow-md border border-slate-200">
            <h2 class="text-xl font-bold text-blue-800 mb-3">📅 Kalender-Termine:</h2>
            <ul id="calendarList" class="space-y-2 text-lg">
                <li class="text-slate-500">Keine Termine eingetragen.</li>
            </ul>
        </div>

        <!-- Ansicht: To-Dos & Notizen -->
        <div id="todoView" class="hidden bg-white p-5 rounded-2xl shadow-md border border-slate-200">
            <h2 class="text-xl font-bold text-blue-800 mb-3">📝 To-Dos & Notizen:</h2>
            <ul id="todoList" class="space-y-2 text-lg">
                <li class="text-slate-500">Keine offenen To-Dos.</li>
            </ul>
        </div>

    </main>

    <!-- Fußbereich -->
    <footer class="bg-slate-200 text-center p-4 text-sm text-slate-600 flex justify-between items-center px-6">
        <span>Einfach bedienbare Web-App</span>
        <button onclick="clearAllMemory()" class="bg-red-500 hover:bg-red-600 text-white px-3 py-1 rounded-lg text-xs font-semibold shadow">
            🗑️ Gedächtnis löschen
        </button>
    </footer>

    <!-- JavaScript -->
    <script>
        const recordBtn = document.getElementById('recordBtn');
        const recordText = document.getElementById('recordText');
        const statusMessage = document.getElementById('statusMessage');
        const calendarList = document.getElementById('calendarList');
        const todoList = document.getElementById('todoList');
        const settingsBox = document.getElementById('settingsBox');
        const apiKeyInput = document.getElementById('apiKeyInput');
        const googleClientIdInput = document.getElementById('googleClientIdInput');
        const userNameInput = document.getElementById('userNameInput');
        const userNameDisplay = document.getElementById('userNameDisplay');
        const connectionStatus = document.getElementById('connectionStatus');
        
        const contactNameInput = document.getElementById('contactNameInput');
        const contactPhoneInput = document.getElementById('contactPhoneInput');
        const contactListDisplay = document.getElementById('contactListDisplay');

        const calendarView = document.getElementById('calendarView');
        const todoView = document.getElementById('todoView');
        const tabCalendarBtn = document.getElementById('tabCalendarBtn');
        const tabTodoBtn = document.getElementById('tabTodoBtn');

        let currentUserName = localStorage.getItem('user_custom_name') || "Dino";
        userNameInput.value = currentUserName;
        updateUserGreeting();

        function updateUserGreeting() {
            userNameDisplay.textContent = `Hallo, ${currentUserName}!`;
        }

        function saveUserNameSetting() {
            const newName = userNameInput.value.trim();
            if (newName) {
                currentUserName = newName;
                localStorage.setItem('user_custom_name', currentUserName);
                updateUserGreeting();
                connectionStatus.textContent = `Name auf "${currentUserName}" geändert.`;
            } else {
                alert('Bitte gib einen Namen ein.');
            }
        }

        let calendarEntries = JSON.parse(localStorage.getItem('helfer_calendar_entries')) || [];
        let todoEntries = JSON.parse(localStorage.getItem('helfer_todo_entries')) || [];
        let memoryItems = JSON.parse(localStorage.getItem('helfer_memory')) || {};
        let savedContacts = JSON.parse(localStorage.getItem('helfer_contacts')) || {};
        
        renderAllLists();
        renderContactList();

        function saveContact() {
            const name = contactNameInput.value.trim();
            const phone = contactPhoneInput.value.trim();
            if (name && phone) {
                savedContacts[name.toLowerCase()] = { originalName: name, phone: phone };
                localStorage.setItem('helfer_contacts', JSON.stringify(savedContacts));
                contactNameInput.value = '';
                contactPhoneInput.value = '';
                renderContactList();
                connectionStatus.textContent = `Kontakt "${name}" gespeichert.`;
            } else {
                alert('Bitte Name und Telefonnummer eingeben.');
            }
        }

        function deleteContact(key) {
            delete savedContacts[key];
            localStorage.setItem('helfer_contacts', JSON.stringify(savedContacts));
            renderContactList();
        }

        function renderContactList() {
            const keys = Object.keys(savedContacts);
            if (keys.length === 0) {
                contactListDisplay.innerHTML = 'Keine Kontakte gespeichert.';
            } else {
                let html = '<b>Gespeicherte Kontakte:</b><br>';
                keys.forEach(k => {
                    html += `<div class="flex justify-between items-center my-1"><span>• ${savedContacts[k].originalName}: ${savedContacts[k].phone}</span> <button onclick="deleteContact('${k}')" class="text-red-600 font-bold ml-2">Löschen</button></div>`;
                });
                contactListDisplay.innerHTML = html;
            }
        }

        function switchTab(tab) {
            if (tab === 'calendar') {
                calendarView.classList.remove('hidden');
                todoView.classList.add('hidden');
                tabCalendarBtn.className = "flex-1 py-2 rounded-lg font-bold text-base bg-white text-blue-800 shadow-sm transition";
                tabTodoBtn.className = "flex-1 py-2 rounded-lg font-bold text-base text-slate-600 transition";
            } else {
                todoView.classList.remove('hidden');
                calendarView.classList.add('hidden');
                tabTodoBtn.className = "flex-1 py-2 rounded-lg font-bold text-base bg-white text-blue-800 shadow-sm transition";
                tabCalendarBtn.className = "flex-1 py-2 rounded-lg font-bold text-base text-slate-600 transition";
            }
        }

        const savedKey = localStorage.getItem('user_api_key');
        if (savedKey) apiKeyInput.value = savedKey;

        const savedClientId = localStorage.getItem('google_client_id') || "399573320370-qka01ghj0s88eoair7lla665cbj10o4g.apps.googleusercontent.com";
        googleClientIdInput.value = savedClientId;
        localStorage.setItem('google_client_id', savedClientId);

        let tokenClient;
        let accessToken = localStorage.getItem('google_access_token');

        function toggleSettings() {
            settingsBox.classList.toggle('hidden');
        }

        function saveApiKey() {
            const key = apiKeyInput.value.trim();
            if (key) {
                localStorage.setItem('user_api_key', key);
                connectionStatus.textContent = "Groq-Schlüssel gespeichert.";
            } else {
                alert('Bitte gib einen gültigen Schlüssel ein.');
            }
        }

        function saveGoogleClientId() {
            const clientId = googleClientIdInput.value.trim();
            if (clientId) {
                localStorage.setItem('google_client_id', clientId);
                connectionStatus.textContent = "Google Client-ID gespeichert.";
            } else {
                alert('Bitte gib eine Client-ID ein.');
            }
        }

        function loginWithGoogle() {
            const clientId = localStorage.getItem('google_client_id');
            if (!clientId) {
                alert('Bitte zuerst die Google Client-ID eintragen!');
                return;
            }

            try {
                tokenClient = google.accounts.oauth2.initTokenClient({
                    client_id: clientId,
                    scope: 'https://www.googleapis.com/auth/calendar.events',
                    callback: (response) => {
                        if (response.error) {
                            connectionStatus.textContent = `❌ Fehler: ${response.error}`;
                            return;
                        }
                        accessToken = response.access_token;
                        localStorage.setItem('google_access_token', accessToken);
                        connectionStatus.textContent = "✅ Mit Google Kalender verbunden!";
                    },
                });
                tokenClient.requestAccessToken();
            } catch (error) {
                connectionStatus.textContent = `❌ Fehler: ${error.message}`;
            }
        }

        function speak(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'de-DE';
                utterance.rate = 1.0;
                window.speechSynthesis.speak(utterance);
            }
        }

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition = null;
        let isRecording = false;

        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.lang = 'de-DE';
            recognition.interimResults = false;
            recognition.maxAlternatives = 1;

            recognition.onstart = function() {
                isRecording = true;
                statusMessage.textContent = "Höre zu... Bitte sprechen.";
                recordBtn.classList.remove('bg-red-600', 'hover:bg-red-700');
                recordBtn.classList.add('bg-emerald-600', 'hover:bg-emerald-700', 'animate-pulse');
                recordText.textContent = "HÖRE...";
            };

            recognition.onresult = function(event) {
                const speechResult = event.results[0][0].transcript;
                statusMessage.textContent = `Erkannt: "${speechResult}"`;
                
                const lower = speechResult.toLowerCase();
                
                // Direkte Sprachprüfung für Anrufe vorab abfangen
                if ((lower.includes("ruf") || lower.includes("anrufen")) && lower.includes("an")) {
                    handleCallCommand(lower);
                } else if (lower.includes("was steht heute an") || lower.includes("was liegt heute an") || lower.includes("bevor ich das haus verlasse")) {
                    triggerDailyBriefing();
                } else {
                    sendToGroqSmart(speechResult);
                }
            };

            recognition.onerror = function() {
                statusMessage.textContent = "Sprachfehler oder abgebrochen.";
                resetButton();
            };

            recognition.onend = function() {
                isRecording = false;
                resetButton();
            };
        } else {
            statusMessage.textContent = "Keine Spracherkennung im Browser.";
            recordBtn.disabled = true;
        }

        function handleCallCommand(text) {
            let foundContact = null;
            for (let key in savedContacts) {
                if (text.includes(key)) {
                    foundContact = savedContacts[key];
                    break;
                }
            }

            if (foundContact) {
                speak(`Ich rufe ${foundContact.originalName} an.`);
                window.location.href = `tel:${foundContact.phone}`;
            } else {
                speak("Diesen Kontakt habe ich leider nicht gefunden. Bitte füge ihn in den Einstellungen hinzu.");
            }
        }

        function toggleSpeechRecognition() {
            const currentKey = localStorage.getItem('user_api_key');
            if (!currentKey) {
                alert('Bitte hinterlege zuerst deinen Groq API-Key oben über "⚙️ Einstellungen"!');
                settingsBox.classList.remove('hidden');
                return;
            }

            if (!recognition) {
                alert('Spracherkennung wird vom Browser nicht unterstützt.');
                return;
            }

            if (isRecording) {
                recognition.stop();
            } else {
                try {
                    recognition.start();
                } catch (e) {
                    recognition.stop();
                    setTimeout(() => recognition.start(), 200);
                }
            }
        }

        function resetButton() {
            isRecording = false;
            recordBtn.classList.remove('bg-emerald-600', 'hover:bg-emerald-700', 'animate-pulse');
            recordBtn.classList.add('bg-red-600', 'hover:bg-red-700');
            recordText.textContent = "SPRECHEN";
        }

        function triggerDailyBriefing() {
            let briefingText = `Mensch ${currentUserName}, pass auf, hier ist dein kurzer Überblick bevor du das Haus verlässt: `;

            if (calendarEntries.length > 0) {
                briefingText += "Deine Termine: ";
                calendarEntries.forEach(e => {
                    briefingText += `${e.text}, am ${e.date}. `;
                });
            }

            // STRENGES FILTERN: Kuscheltiere, Kuscheltier, Spielzeug etc. IMMER AUSSCHLIESSEN
            const unimportantKeywords = ["kuscheltier", "spielzeug", "puppe", "teddy", "kuscheltiere"];
            const memKeys = Object.keys(memoryItems);
            let relevantItems = [];

            memKeys.forEach(k => {
                let isUnimportant = unimportantKeywords.some(badWord => k.toLowerCase().includes(badWord));
                if (!isUnimportant) {
                    relevantItems.push({ name: k, loc: memoryItems[k] });
                }
            });

            if (relevantItems.length > 0) {
                briefingText += "Und denk an deine wichtigen Sachen: ";
                relevantItems.forEach(item => {
                    // Artikel-Korrektur (z.B. "deine Brille" statt "dein Brille")
                    let art = "dein";
                    let lowerName = item.name.toLowerCase();
                    if (lowerName.endsWith('e') || lowerName.includes('brille') || lowerName.includes('tasche') || lowerName.includes('uhr')) {
                        art = "deine";
                    }
                    briefingText += `${art} ${item.name} liegt ${item.loc}, `;
                });
            }

            if (calendarEntries.length === 0 && relevantItems.length === 0) {
                briefingText += "Es gibt heute keine besonderen Termine oder wichtigen Gegenstände zu beachten. ";
            }

            briefingText += "Komm gut durch den Tag! ";
            speak(briefingText);
        }

        async function sendToGroqSmart(text) {
            const key = localStorage.getItem('user_api_key');
            statusMessage.textContent = "Verarbeite...";

            const memoryContext = JSON.stringify(memoryItems);

            try {
                const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${key}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        model: "openai/gpt-oss-120b",
                        response_format: { type: "json_object" },
                        messages: [
                            {
                                role: "system",
                                content: `Du bist ein absolut fehlerfreier, hochpräziser, menschlicher und herzlicher deutscher Alltags-Assistent für ${currentUserName}.
                                Aktuelles Jahr ist 2026, heute ist ${new Date().toISOString().split('T')[0]}.
                                Bisheriges Gedächtnis über Gegenstände: ${memoryContext}
                                
                                ABSOLUTE GRAMMATIK- UND RECHTSCHREIBGESETZE (STRICT GUIDELINES):
                                1. DAS WORT "PORTMONNAIE" / "GELDBEUTEL":
                                   - Es heisst NIEMALS "Popmoney", "Popmannee", "Popmonnee" oder ähnlich falsches Zeug!
                                   - Es heisst IMMER und ausschliesslich korrekt geschrieben: "Portemonnaie" (bzw. gesprochen "Portmonnaie"). Du musst diesen Begriff absolut fehlerfrei verwenden.
                                2. GRAMMATIK UND BESITZANZEIGENDE FÜRWÖRTER (ARTIKEL / KASUS):
                                   - NIEMALS "dein Brille" oder ähnlicher Unfug! Bei weiblichen oder Plural-Gegenständen heisst es zwingend "deine Brille", "deine Schlüssel", "deine Papiere". Bei männlichen/sächlichen Dingen "dein Portemonnaie", "dein Handy". Achte penibel darauf!
                                   - Orte und Ablageorte müssen immer mit korrekter Präposition und Artikel stehen (Beispiele: "in der Vitrine", "auf dem Tisch", "im Küchenschrank", "unter der Bank").
                                3. SPRACHLICHER STIL:
                                   - Antworte immer auf natürlichstes, fehlerfreies Deutsch. Keine Roboter-Sprache, sondern locker, herzlich und direkt.
                                   - Wenn ${currentUserName} nach einem Gegenstand fragt, antworte präzise mit dem genauen Speicherort aus deinem Gedächtnis.
                                
                                KLASSIFIZIERUNG DER TYPEN:
                                1. "chat": Smalltalk, Unterhaltung, Fragen.
                                2. "name_change": Namensänderung.
                                3. "item_store": Gegenstand ablegen (z.B. "Brille liegt auf dem Tisch").
                                4. "item_query": Nach einem Gegenstand fragen.
                                5. "note": To-Dos oder Notizen ohne feste Uhrzeit.
                                6. "calendar": Termine mit fester Uhrzeit.

                                Gib ein JSON-Objekt zurück mit:
                                - "type": string ("chat", "name_change", "item_store", "item_query", "note", "calendar")
                                - "new_name": string
                                - "item_name": string
                                - "item_location": string (vollständiger Satz mit Präposition und Artikel, z.B. "in der Vitrine")
                                - "note_text": string
                                - "summary": string
                                - "start_time": string (ISO-Format für Kalendertermine, z.B. 2026-09-15T14:30:00)
                                - "reply": string (Deine sehr menschliche, herzliche Antwort auf Deutsch mit absolut fehlerfreier Grammatik, korrekter Portemonnaie-Schreibweise und exakten Artikeln wie "deine Brille")`
                            },
                            {
                                role: "user",
                                content: text
                            }
                        ]
                    })
                });

                if (!response.ok) throw new Error("API-Anfrage fehlgeschlagen");

                const data = await response.json();
                const aiData = JSON.parse(data.choices[0].message.content);

                let finalReply = aiData.reply;

                if (aiData.type === 'name_change' && aiData.new_name) {
                    currentUserName = aiData.new_name;
                    localStorage.setItem('user_custom_name', currentUserName);
                    userNameInput.value = currentUserName;
                    updateUserGreeting();
                    finalReply = `Alles klar, ${currentUserName}, ab sofort nenne ich dich so!`;
                }

                if (aiData.type === 'item_store' && aiData.item_name && aiData.item_location) {
                    let cleanName = aiData.item_name.toLowerCase();
                    let cleanLoc = aiData.item_location;
                    if (!cleanLoc.startsWith("in") && !cleanLoc.startsWith("auf") && !cleanLoc.startsWith("unter") && !cleanLoc.startsWith("neben")) {
                        cleanLoc = "in der " + cleanLoc;
                    }
                    memoryItems[cleanName] = cleanLoc;
                    localStorage.setItem('helfer_memory', JSON.stringify(memoryItems));
                }

                if (aiData.type === 'item_query' && aiData.item_name) {
                    let cleanQuery = aiData.item_name.toLowerCase();
                    let foundLocation = null;
                    let matchedName = aiData.item_name;

                    for (let storedKey in memoryItems) {
                        if (cleanQuery.includes(storedKey) || storedKey.includes(cleanQuery)) {
                            foundLocation = memoryItems[storedKey];
                            matchedName = storedKey.charAt(0).toUpperCase() + storedKey.slice(1);
                            break;
                        }
                    }

                    if (foundLocation) {
                        let art = "Dein";
                        let lowerStored = matchedName.toLowerCase();
                        if (lowerStored.endsWith('e') || lowerStored.includes('brille') || lowerStored.includes('tasche')) {
                            art = "Deine";
                        }
                        finalReply = `Kein Problem, ${currentUserName}! ${art} ${matchedName} liegt ${foundLocation}.`;
                    } else {
                        let art = "dein";
                        let lowerAi = aiData.item_name.toLowerCase();
                        if (lowerAi.endsWith('e') || lowerAi.includes('brille') || lowerAi.includes('tasche')) {
                            art = "deine";
                        }
                        finalReply = `Du, ${currentUserName}, ich habe leider keinen Schimmer, wo ${art} ${aiData.item_name} liegen soll.`;
                    }
                }

                statusMessage.textContent = "Fertig.";
                speak(finalReply);

                if (aiData.type === 'calendar') {
                    let calendarEventId = null;
                    let formattedDate = new Date().toLocaleString('de-DE', { dateStyle: 'medium', timeStyle: 'short' });
                    
                    if (aiData.start_time) {
                        calendarEventId = await createGoogleCalendarEvent(aiData.summary || text, aiData.start_time);
                        const parsedDate = new Date(aiData.start_time);
                        if (!isNaN(parsedDate)) {
                            formattedDate = parsedDate.toLocaleString('de-DE', { dateStyle: 'medium', timeStyle: 'short' });
                        }
                    }

                    const newCalEntry = {
                        id: Date.now(),
                        calendarId: calendarEventId,
                        text: aiData.summary || text,
                        date: formattedDate
                    };
                    calendarEntries.unshift(newCalEntry);
                    localStorage.setItem('helfer_calendar_entries', JSON.stringify(calendarEntries));
                } else if (aiData.type === 'note') {
                    const newTodoEntry = {
                        id: Date.now(),
                        text: aiData.note_text || text,
                        date: new Date().toLocaleDateString('de-DE', { hour: '2-digit', minute: '2-digit' })
                    };
                    todoEntries.unshift(newTodoEntry);
                    localStorage.setItem('helfer_todo_entries', JSON.stringify(todoEntries));
                }

                renderAllLists();

            } catch (error) {
                statusMessage.textContent = "❌ Fehler bei der Verarbeitung.";
                speak(`Da ist wohl was schiefgegangen, ${currentUserName}.`);
                console.error(error);
            }
        }

        async function createGoogleCalendarEvent(summary, startTimeStr) {
            if (!accessToken) return null;

            const startDate = new Date(startTimeStr);
            const endDate = new Date(startDate.getTime() + 60 * 60 * 1000);

            const event = {
                summary: summary,
                start: { dateTime: startDate.toISOString() },
                end: { dateTime: endDate.toISOString() }
            };

            try {
                const res = await fetch('https://www.googleapis.com/calendar/v3/calendars/primary/events', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${accessToken}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(event)
                });

                if (res.ok) {
                    const data = await res.json();
                    return data.id;
                }
            } catch (e) {
                console.error(e);
            }
            return null;
        }

        async function deleteCalendarEntry(id, calendarId) {
            if (calendarId && accessToken) {
                try {
                    await fetch(`https://www.googleapis.com/calendar/v3/calendars/primary/events/${calendarId}`, {
                        method: 'DELETE',
                        headers: { 'Authorization': `Bearer ${accessToken}` }
                    });
                } catch (e) {
                    console.error("Fehler beim Löschen im Google Kalender:", e);
                }
            }

            calendarEntries = calendarEntries.filter(e => e.id !== id);
            localStorage.setItem('helfer_calendar_entries', JSON.stringify(calendarEntries));
            renderAllLists();
            speak("Termin gelöscht.");
        }

        function deleteTodoEntry(id) {
            todoEntries = todoEntries.filter(e => e.id !== id);
            localStorage.setItem('helfer_todo_entries', JSON.stringify(todoEntries));
            renderAllLists();
            speak("To-Do erledigt.");
        }

        function clearAllMemory() {
            memoryItems = {};
            localStorage.removeItem('helfer_memory');
            speak("Gedächtnis komplett gelöscht.");
        }

        function renderAllLists() {
            // Kalender Liste
            if (calendarEntries.length === 0) {
                calendarList.innerHTML = '<li class="text-slate-500">Keine Termine eingetragen.</li>';
            } else {
                calendarList.innerHTML = '';
                calendarEntries.forEach(entry => {
                    const li = document.createElement('li');
                    li.className = "bg-slate-50 p-3 rounded-xl border border-slate-100 flex justify-between items-center text-base";
                    li.innerHTML = `
                        <div>
                            <span>📅 ${entry.text}</span>
                            <div class="text-xs text-slate-400">${entry.date}</div>
                        </div>
                        <button onclick="deleteCalendarEntry(${entry.id}, '${entry.calendarId || ''}')" class="bg-red-500 hover:bg-red-600 text-white px-3 py-1 rounded-lg text-sm font-semibold ml-2">
                            Löschen
                        </button>
                    `;
                    calendarList.appendChild(li);
                });
            }

            // To-Do Liste
            if (todoEntries.length === 0) {
                todoList.innerHTML = '<li class="text-slate-500">Keine offenen To-Dos.</li>';
            } else {
                todoList.innerHTML = '';
                todoEntries.forEach(entry => {
                    const li = document.createElement('li');
                    li.className = "bg-slate-50 p-3 rounded-xl border border-slate-100 flex justify-between items-center text-base";
                    li.innerHTML = `
                        <div>
                            <span>📝 ${entry.text}</span>
                            <div class="text-xs text-slate-400">${entry.date}</div>
                        </div>
                        <button onclick="deleteTodoEntry(${entry.id})" class="bg-emerald-500 hover:bg-emerald-600 text-white px-3 py-1 rounded-lg text-sm font-semibold ml-2">
                            Erledigt
                        </button>
                    `;
                    todoList.appendChild(li);
                });
            }
        }
    </script>
</body>
