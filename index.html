<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mein Helfer – Sprachassistent</title>
    <!-- Tailwind CSS für schnelles, sauberes Design -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Große, seniorenfreundliche Schriftgröße als Basis */
        body {
            font-size: 1.25rem;
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-900 min-h-screen flex flex-col justify-between">

    <!-- Kopfbereich -->
    <header class="bg-blue-700 text-white p-6 text-center shadow-md">
        <h1 class="text-3xl font-bold">Mein Alltags-Helfer</h1>
        <p class="text-lg text-blue-100 mt-1">Sprechen Sie einfach mit der App</p>
    </header>

    <!-- Hauptbereich -->
    <main class="container mx-auto p-4 max-w-md flex-grow flex flex-col justify-center space-y-6">

        <!-- Großer Mikrofon-Button -->
        <div class="flex flex-col items-center">
            <button id="recordBtn" onclick="toggleSpeechRecognition()" class="w-40 h-40 bg-red-600 hover:bg-red-700 text-white rounded-full flex flex-col items-center justify-center shadow-2xl transition transform active:scale-95 border-4 border-white">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-20 w-20 mb-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z" />
                </svg>
                <span id="recordText" class="text-sm font-semibold tracking-wide">SPRECHEN</span>
            </button>
            <p id="statusMessage" class="mt-4 text-center font-medium text-slate-700 h-8">Drücken und sprechen...</p>
        </div>

        <!-- Letzter erkannter Text / Ergebnis -->
        <div class="bg-white p-5 rounded-2xl shadow-md border border-slate-200">
            <h2 class="text-xl font-bold text-blue-800 mb-2">Letzte Notiz / Befehl:</h2>
            <p id="outputBox" class="text-slate-600 italic">Noch nichts eingegeben...</p>
        </div>

        <!-- Gespeicherte Einträge / Übersicht -->
        <div class="bg-white p-5 rounded-2xl shadow-md border border-slate-200">
            <h2 class="text-xl font-bold text-blue-800 mb-3">Das Wichtigste für heute:</h2>
            <ul id="entryList" class="space-y-2 text-lg">
                <li class="text-slate-500">Keine Einträge vorhanden.</li>
            </ul>
        </div>

    </main>

    <!-- Fußbereich -->
    <footer class="bg-slate-200 text-center p-4 text-sm text-slate-600">
        Einfach bedienbare Web-App für den Alltag
    </footer>

    <!-- JavaScript für Spracherkennung und Logik -->
    <script>
        const recordBtn = document.getElementById('recordBtn');
        const recordText = document.getElementById('recordText');
        const statusMessage = document.getElementById('statusMessage');
        const outputBox = document.getElementById('outputBox');
        const entryList = document.getElementById('entryList');

        let entries = JSON.parse(localStorage.getItem('helfer_entries')) || [];
        renderEntries();

        // Web Speech API initialisieren
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition;

        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.lang = 'de-DE';
            recognition.interimResults = false;
            recognition.maxAlternatives = 1;

            recognition.onstart = function() {
                statusMessage.textContent = "Höre zu... Bitte sprechen.";
                recordBtn.classList.remove('bg-red-600', 'hover:bg-red-700');
                recordBtn.classList.add('bg-emerald-600', 'hover:bg-emerald-700', 'animate-pulse');
                recordText.textContent = "HÖRE...";
            };

            recognition.onresult = function(event) {
                const speechResult = event.results[0][0].transcript;
                outputBox.textContent = `"${speechResult}"`;
                processInput(speechResult);
            };

            recognition.onerror = function(event) {
                statusMessage.textContent = "Fehler bei der Spracherkennung. Noch einmal versuchen.";
                resetButton();
            };

            recognition.onend = function() {
                statusMessage.textContent = "Fertig.";
                resetButton();
            };
        } else {
            statusMessage.textContent = "Ihr Browser unterstützt leider keine Spracherkennung.";
            recordBtn.disabled = true;
        }

        function toggleSpeechRecognition() {
            if (recognition) {
                try {
                    recognition.start();
                } catch (e) {
                    recognition.stop();
                }
            }
        }

        function resetButton() {
            recordBtn.classList.remove('bg-emerald-600', 'hover:bg-emerald-700', 'animate-pulse');
            recordBtn.classList.add('bg-red-600', 'hover:bg-red-700');
            recordText.textContent = "SPRECHEN";
        }

        function processInput(text) {
            // Einfache lokale Erkennung (können wir später durch deine KI / Vercel API ersetzen)
            const newEntry = {
                text: text,
                date: new Date().toLocaleDateString('de-DE', { hour: '2-digit', minute: '2-digit' })
            };

            entries.unshift(newEntry);
            if (entries.length > 5) entries.pop(); // Max 5 Einträge behalten
            localStorage.setItem('helfer_entries', JSON.stringify(entries));
            renderEntries();
        }

        function renderEntries() {
            if (entries.length === 0) {
                entryList.innerHTML = '<li class="text-slate-500">Keine Einträge vorhanden.</li>';
                return;
            }

            entryList.innerHTML = '';
            entries.forEach(entry => {
                const li = document.createElement('li');
                li.className = "bg-slate-50 p-3 rounded-xl border border-slate-100 flex justify-between items-center";
                li.innerHTML = `<span>${entry.text}</span> <span class="text-xs text-slate-400">${entry.date}</span>`;
                entryList.appendChild(li);
            });
        }
    </script>
</body>
</html>
