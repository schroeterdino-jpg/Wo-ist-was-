<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mein Helfer – Sprachassistent</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Identity Services (OAuth / Login) -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        body { font-size: 1.25rem; }
    </style>
</head>
<body class="bg-slate-100 text-slate-900 min-h-screen flex flex-col justify-between">

    <!-- Kopfbereich -->
    <header class="bg-blue-700 text-white p-6 text-center shadow-md relative">
        <h1 class="text-3xl font-bold">Mein Alltags-Helfer</h1>
        <p class="text-lg text-blue-100 mt-1">Sprechen Sie einfach mit der App</p>
        <button onclick="toggleSettings()" class="absolute top-4 right-4 bg-blue-800 hover:bg-blue-900 text-white px-3 py-1 rounded-lg text-sm">
            ⚙️ Schlüssel & Google
        </button>
    </header>

    <!-- Einstellungs-Box -->
    <div id="settingsBox" class="hidden bg-amber-50 border-b border-amber-200 p-4 shadow-inner">
        <div class="container mx-auto max-w-md space-y-4">
            <!-- Groq API Key -->
            <div>
                <label class="block text-sm font-bold text-amber-900 mb-1">Groq API-Key (gsk_...):</label>
                <div class="flex gap-2">
                    <input type="password" id="apiKeyInput" placeholder="gsk_..." class="flex-grow p-2 border border-amber-300 rounded-lg text-base">
                    <button onclick="saveApiKey()" class="bg-amber-600 hover:bg-amber-700 text-white px-4 py-2 rounded-lg text-base font-semibold">Speichern</button>
                </div>
            </div>

            <!-- Google Client ID -->
            <div>
                <label class="block text-sm font-bold text-amber-900 mb-1">Google Client-ID:</label>
                <div class="flex gap-2">
                    <input type="text" id="googleClientIdInput" placeholder="399573320370-..." class="flex-grow p-2 border border-amber-300 rounded-lg text-base">
                    <button onclick="saveGoogleClientId()" class="bg-amber-600 hover:bg-amber-700 text-white px-4 py-2 rounded-lg text-base font-semibold">Speichern</button>
                </div>
            </div>

            <div class="flex flex-col gap-2">
                <button onclick="checkGroqConnection()" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-2 rounded-lg text-sm font-medium">
                    🔍 Groq-Verbindung prüfen
                </button>
                <button onclick="loginWithGoogle()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-2 rounded-lg text-sm font-medium flex items-center justify-center gap-2">
                    📅 Mit Google Kalender verbinden
                </button>
            </div>
            <p id="connectionStatus" class="text-xs text-amber-800 mt-2 font-medium break-all"></p>
        </div>
    </div>

    <!-- Hauptbereich -->
    <main class="container mx-auto p-4 max-w-md flex-grow flex flex-col justify-center space-y-6">

        <!-- Großer Mikrofon-Button -->
        <div class="flex flex-col items-center">
            <button id="recordBtn" onclick="toggleSpeechRecognition()" class="w-40 h-40 bg-red-600 hover:bg-red-700 text-white rounded-full flex flex-col items-center justify-center shadow-2xl transition transform active:scale-95 border-4 border-white cursor-pointer">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-20 w-20 mb-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z" />
                </svg>
                <span id="recordText" class="text-sm font-semibold tracking-wide">SPRECHEN</span>
            </button>
            <p id="statusMessage" class="mt-4 text-center font-medium text-slate-700 h-8">Drücken und sprechen...</p>
        </div>

        <!-- Ergebnis-Box -->
        <div class="bg-white p-5 rounded-2xl shadow-md border border-slate-200">
            <h2 class="text-xl font-bold text-blue-800 mb-2">Erkannter Befehl / KI-Antwort:</h2>
            <p id="outputBox" class="text-slate-600 italic">Noch nichts eingegeben...</p>
        </div>

        <!-- Gespeicherte Einträge -->
        <div class="bg-white p-5 rounded-2xl shadow-md border border-slate-200">
            <h2 class="text-xl font-bold text-blue-800 mb-3">Das Wichtigste für heute:</h2>
            <ul id="entryList" class="space-y-2 text-lg">
                <li class="text-slate-500">Keine Einträge vorhanden.</li>
            </ul>
        </div>

    </main>

    <!-- Fußbereich -->
    <footer class="bg-slate-200 text-center p-4 text-sm text-slate-600">
        Einfach bedienbare Web-App für den Alltag
    </footer>

    <!-- JavaScript -->
    <script>
        const recordBtn = document.getElementById('recordBtn');
        const recordText = document.getElementById('recordText');
        const statusMessage = document.getElementById('statusMessage');
        const outputBox = document.getElementById('outputBox');
        const entryList = document.getElementById('entryList');
        const settingsBox = document.getElementById('settingsBox');
        const apiKeyInput = document.getElementById('apiKeyInput');
        const googleClientIdInput = document.getElementById('googleClientIdInput');
        const connectionStatus = document.getElementById('connectionStatus');

        let entries = JSON.parse(localStorage.getItem('helfer_entries')) || [];
        renderEntries();

        // Gespeicherte Werte laden
        const savedKey = localStorage.getItem('user_api_key');
        if (savedKey) apiKeyInput.value = savedKey;

        const savedClientId = localStorage.getItem('google_client_id') || "399573320370-qka01ghj0s88eoair7lla665cbj10o4g.apps.googleusercontent.com";
        googleClientIdInput.value = savedClientId;
        localStorage.setItem('google_client_id', savedClientId);

        let tokenClient;
        let accessToken = localStorage.getItem('google_access_token');

        function toggleSettings() {
            settingsBox.classList.toggle('hidden');
        }

        function saveApiKey() {
            const key = apiKeyInput.value.trim();
            if (key) {
                localStorage.setItem('user_api_key', key);
                connectionStatus.textContent = "Groq-Schlüssel gespeichert.";
                checkGroqConnection();
            } else {
                alert('Bitte gib einen gültigen Groq-Schlüssel ein.');
            }
        }

        function saveGoogleClientId() {
            const clientId = googleClientIdInput.value.trim();
            if (clientId) {
                localStorage.setItem('google_client_id', clientId);
                connectionStatus.textContent = "Google Client-ID gespeichert.";
            } else {
                alert('Bitte gib eine Client-ID ein.');
            }
        }

        // Google OAuth Token initialisieren und anfordern
        function loginWithGoogle() {
            const clientId = localStorage.getItem('google_client_id');
            if (!clientId) {
                alert('Bitte zuerst die Google Client-ID eintragen!');
                return;
            }

            try {
                tokenClient = google.accounts.oauth2.initTokenClient({
                    client_id: clientId,
                    scope: 'https://www.googleapis.com/auth/calendar.events',
                    callback: (response) => {
                        if (response.error) {
                            connectionStatus.textContent = `❌ Google Login Fehler: ${response.error}`;
                            return;
                        }
                        accessToken = response.access_token;
                        localStorage.setItem('google_access_token', accessToken);
                        connectionStatus.textContent = "✅ Erfolgreich mit Google Kalender verbunden!";
                    },
                });
                tokenClient.requestAccessToken();
            } catch (error) {
                connectionStatus.textContent = `❌ Fehler beim Initialisieren von Google Auth: ${error.message}`;
            }
        }

        // Verbindung zu Groq prüfen
        async function checkGroqConnection() {
            const key = localStorage.getItem('user_api_key');
            if (!key) {
                connectionStatus.textContent = "⚠️ Kein Groq-Schlüssel hinterlegt.";
                return;
            }

            connectionStatus.textContent = "Prüfe Verbindung zu Groq...";
            try {
                const response = await fetch('https://api.groq.com/openai/v1/models', {
                    method: 'GET',
                    headers: { 'Authorization': `Bearer ${key}` }
                });

                if (response.ok) {
                    connectionStatus.textContent = `✅ Groq verbunden! (Modell: openai/gpt-oss-120b)`;
                } else {
                    const errorDetails = await response.text();
                    connectionStatus.textContent = `❌ Fehler ${response.status}: ${errorDetails}`;
                }
            } catch (error) {
                connectionStatus.textContent = `❌ Netzwerkfehler: ${error.message}`;
            }
        }

        // Web Speech API Steuerung
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition = null;
        let isRecording = false;

        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.lang = 'de-DE';
            recognition.interimResults = false;
            recognition.maxAlternatives = 1;

            recognition.onstart = function() {
                isRecording = true;
                statusMessage.textContent = "Höre zu... Bitte sprechen.";
                recordBtn.classList.remove('bg-red-600', 'hover:bg-red-700');
                recordBtn.classList.add('bg-emerald-600', 'hover:bg-emerald-700', 'animate-pulse');
                recordText.textContent = "HÖRE...";
            };

            recognition.onresult = function(event) {
                const speechResult = event.results[0][0].transcript;
                outputBox.textContent = `"${speechResult}"`;
                sendToGroqAndCalendar(speechResult);
            };

            recognition.onerror = function(event) {
                statusMessage.textContent = "Sprachfehler oder abgebrochen.";
                resetButton();
            };

            recognition.onend = function() {
                isRecording = false;
                resetButton();
            };
        } else {
            statusMessage.textContent = "Keine Spracherkennung im Browser.";
            recordBtn.disabled = true;
        }

        function toggleSpeechRecognition() {
            const currentKey = localStorage.getItem('user_api_key');
            if (!currentKey) {
                alert('Bitte hinterlege zuerst deinen Groq API-Key oben über "⚙️ Schlüssel & Google"!');
                settingsBox.classList.remove('hidden');
                return;
            }

            if (!recognition) {
                alert('Spracherkennung wird von diesem Browser leider nicht unterstützt.');
                return;
            }

            if (isRecording) {
                recognition.stop();
            } else {
                try {
                    recognition.start();
                } catch (e) {
                    recognition.stop();
                    setTimeout(() => recognition.start(), 200);
                }
            }
        }

        function resetButton() {
            isRecording = false;
            recordBtn.classList.remove('bg-emerald-600', 'hover:bg-emerald-700', 'animate-pulse');
            recordBtn.classList.add('bg-red-600', 'hover:bg-red-700');
            recordText.textContent = "SPRECHEN";
        }

        // KI-Anfrage über Groq mit JSON-Extraktion für den Kalender
        async function sendToGroqAndCalendar(text) {
            const key = localStorage.getItem('user_api_key');
            outputBox.textContent = "Verarbeite Termin mit KI...";

            try {
                const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${key}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        model: "openai/gpt-oss-120b",
                        response_format: { type: "json_object" },
                        messages: [
                            {
                                role: "system",
                                content: `Du bist ein Assistent für ältere Menschen. Analysiere den gesprochenen Satz. 
                                Gib ein JSON-Objekt zurück mit folgenden Feldern:
                                - "is_event": boolean (true, wenn es ein Termin oder eine Erinnerung ist)
                                - "summary": string (Titel des Termins)
                                - "start_time": string (ISO 8601 Format YYYY-MM-DDTHH:MM:SS, aktives Jahr ist 2026. Wenn keine Uhrzeit genannt wird, nimm 10:00:00. Heute ist der ${new Date().toISOString().split('T')[0]})
                                - "reply": string (eine kurze, freundliche Bestätigung auf Deutsch für den Nutzer)`
                            },
                            {
                                role: "user",
                                content: text
                            }
                        ]
                    })
                });

                if (!response.ok) {
                    const errorDetails = await response.text();
                    throw new Error(`HTTP ${response.status}: ${errorDetails}`);
                }

                const data = await response.json();
                const aiData = JSON.parse(data.choices[0].message.content);

                outputBox.textContent = aiData.reply;

                // Wenn es ein Kalendereintrag ist und ein Google Token da ist -> direkt in Google Kalender eintragen
                if (aiData.is_event) {
                    await createGoogleCalendarEvent(aiData.summary, aiData.start_time);
                }

                const newEntry = {
                    text: aiData.reply,
                    date: new Date().toLocaleDateString('de-DE', { hour: '2-digit', minute: '2-digit' })
                };

                entries.unshift(newEntry);
                if (entries.length > 5) entries.pop();
                localStorage.setItem('helfer_entries', JSON.stringify(entries));
                renderEntries();

            } catch (error) {
                outputBox.textContent = `❌ Fehlerdetails: ${error.message}`;
                console.error(error);
            }
        }

        // Termin direkt in den Google Kalender eintragen
        async function createGoogleCalendarEvent(summary, startTimeStr) {
            if (!accessToken) {
                outputBox.textContent += " (⚠️ Nicht mit Google Kalender verbunden - Termin nur lokal gespeichert)";
                return;
            }

            const startDate = new Date(startTimeStr);
            const endDate = new Date(startDate.getTime() + 60 * 60 * 1000); // 1 Stunde Dauer standardmäßig

            const event = {
                summary: summary,
                start: { dateTime: startDate.toISOString() },
                end: { dateTime: endDate.toISOString() }
            };

            try {
                const res = await fetch('https://www.googleapis.com/calendar/v3/calendars/primary/events', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${accessToken}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(event)
                });

                if (res.ok) {
                    outputBox.textContent += " ✅ Erfolgreich in Google Kalender eingetragen!";
                } else {
                    const errText = await res.text();
                    outputBox.textContent += ` ❌ Kalender-Fehler: ${errText}`;
                }
            } catch (e) {
                console.error(e);
            }
        }

        function renderEntries() {
            if (entries.length === 0) {
                entryList.innerHTML = '<li class="text-slate-500">Keine Einträge vorhanden.</li>';
                return;
            }

            entryList.innerHTML = '';
            entries.forEach(entry => {
                const li = document.createElement('li');
                li.className = "bg-slate-50 p-3 rounded-xl border border-slate-100 flex justify-between items-center text-base";
                li.innerHTML = `<span>${entry.text}</span> <span class="text-xs text-slate-400">${entry.date}</span>`;
                entryList.appendChild(li);
            });
        }
    </script>
</body>
</html>
