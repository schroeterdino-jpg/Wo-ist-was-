<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mein Helfer – Sprachassistent</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Identity Services (OAuth / Login) -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    
    <!-- Eigenes Icon direkt aus dem Projektordner -->
    <link rel="icon" type="image/png" href="./dino.png">
    <link rel="apple-touch-icon" href="./dino.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">

    <style>
        body { font-size: 1.25rem; }
    </style>
</head>
<body class="bg-slate-100 text-slate-900 min-h-screen flex flex-col justify-between">

    <!-- Kopfbereich -->
    <header class="bg-blue-700 text-white p-6 text-center shadow-md relative">
        <div class="flex justify-between items-center max-w-md mx-auto">
            <div></div>
            <div>
                <h1 class="text-3xl font-bold">Mein Alltags-Helfer</h1>
                <p id="userNameDisplay" class="text-lg text-blue-100 mt-1">Hallo, Silvia!</p>
            </div>
            <button onclick="toggleSettings()" class="bg-blue-800 hover:bg-blue-900 text-white px-3 py-2 rounded-lg text-sm shadow">
                ⚙️ Einstellungen
            </button>
        </div>
    </header>

    <!-- Einstellungs-Box -->
    <div id="settingsBox" class="hidden bg-amber-50 border-b border-amber-200 p-4 shadow-inner">
        <div class="container mx-auto max-w-md space-y-4">
            <div>
                <label class="block text-sm font-bold text-amber-900 mb-1">Wie soll ich dich nennen?:</label>
                <div class="flex gap-2">
                    <input type="text" id="userNameInput" placeholder="Dein Name..." class="flex-grow p-2 border border-amber-300 rounded-lg text-base">
                    <button onclick="saveUserNameSetting()" class="bg-amber-600 hover:bg-amber-700 text-white px-4 py-2 rounded-lg text-base font-semibold">Speichern</button>
                </div>
            </div>

            <div>
                <label class="block text-sm font-bold text-amber-900 mb-1">Groq API-Key (gsk_...):</label>
                <div class="flex gap-2">
                    <input type="password" id="apiKeyInput" placeholder="gsk_..." class="flex-grow p-2 border border-amber-300 rounded-lg text-base">
                    <button onclick="saveApiKey()" class="bg-amber-600 hover:bg-amber-700 text-white px-4 py-2 rounded-lg text-base font-semibold">Speichern</button>
                </div>
            </div>

            <div>
                <label class="block text-sm font-bold text-amber-900 mb-1">Google Client-ID:</label>
                <div class="flex gap-2">
                    <input type="text" id="googleClientIdInput" placeholder="Client ID..." class="flex-grow p-2 border border-amber-300 rounded-lg text-base">
                    <button onclick="saveGoogleClientId()" class="bg-amber-600 hover:bg-amber-700 text-white px-4 py-2 rounded-lg text-base font-semibold">Speichern</button>
                </div>
            </div>

            <!-- Kontakte für Schnell-Anruf -->
            <div class="border-t border-amber-200 pt-3">
                <label class="block text-sm font-bold text-amber-900 mb-1">📞 Schnell-Anruf Kontakte:</label>
                <div class="flex gap-2 mb-2">
                    <input type="text" id="contactNameInput" placeholder="Name (z.B. Simone)" class="w-1/2 p-2 border border-amber-300 rounded-lg text-base">
                    <input type="text" id="contactPhoneInput" placeholder="Nummer..." class="w-1/2 p-2 border border-amber-300 rounded-lg text-base">
                </div>
                <button onclick="saveContact()" class="w-full bg-amber-600 hover:bg-amber-700 text-white py-2 rounded-lg text-base font-semibold">Kontakt hinzufügen</button>
                <div id="contactListDisplay" class="mt-2 text-xs text-amber-900 space-y-1"></div>
            </div>

            <div class="flex flex-col gap-2 border-t border-amber-200 pt-3">
                <button onclick="loginWithGoogle()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-2 rounded-lg text-sm font-medium flex items-center justify-center gap-2">
                    📅 Mit Google Kalender verbinden
                </button>
            </div>
            <p id="connectionStatus" class="text-xs text-amber-800 mt-2 font-medium break-all"></p>
        </div>
    </div>

    <!-- Hauptbereich -->
    <main class="container mx-auto p-4 max-w-md flex-grow flex flex-col justify-center space-y-6">

        <!-- Mikrofon-Button & Tages-Briefing -->
        <div class="flex flex-col items-center space-y-4">
            <button id="recordBtn" onclick="toggleSpeechRecognition()" class="w-40 h-40 bg-red-600 hover:bg-red-700 text-white rounded-full flex flex-col items-center justify-center shadow-2xl transition transform active:scale-95 border-4 border-white cursor-pointer">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-20 w-20 mb-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z" />
                </svg>
                <span id="recordText" class="text-sm font-semibold tracking-wide">SPRECHEN</span>
            </button>
            <p id="statusMessage" class="text-center font-medium text-slate-700 h-6">Drücken und sprechen...</p>

            <button onclick="triggerDailyBriefing()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-3 px-4 rounded-xl shadow-md font-bold text-lg flex items-center justify-center gap-2">
                📋 Was steht heute an? (Briefing)
            </button>
        </div>

        <!-- Reiter-Navigation -->
        <div class="flex bg-slate-200 p-1 rounded-xl">
            <button id="tabCalendarBtn" onclick="switchTab('calendar')" class="flex-1 py-2 rounded-lg font-bold text-sm bg-white text-blue-800 shadow-sm transition">📅 Termine</button>
            <button id="tabTodoBtn" onclick="switchTab('todo')" class="flex-1 py-2 rounded-lg font-bold text-sm text-slate-600 transition">📝 To-Dos</button>
            <button id="tabMemoryBtn" onclick="switchTab('memory')" class="py-2 px-3 rounded-lg font-bold text-xs text-slate-400 hover:text-slate-600 transition" title="Gedächtnis">⚙️</button>
        </div>

        <!-- Ansicht: Kalender-Termine -->
        <div id="calendarView" class="bg-white p-5 rounded-2xl shadow-md border border-slate-200">
            <h2 class="text-xl font-bold text-blue-800 mb-3">📅 Kalender-Termine:</h2>
            <ul id="calendarList" class="space-y-2 text-lg">
                <li class="text-slate-500">Keine Termine eingetragen.</li>
            </ul>
        </div>

        <!-- Ansicht: To-Dos & Notizen -->
        <div id="todoView" class="hidden bg-white p-5 rounded-2xl shadow-md border border-slate-200 space-y-4">
            <h2 class="text-xl font-bold text-blue-800">📝 To-Dos & Notizen:</h2>
            <ul id="todoList" class="space-y-2 text-lg">
                <li class="text-slate-500">Keine offenen To-Dos.</li>
            </ul>
        </div>

        <!-- Ansicht: Gegenstände (versteckter Reiter) -->
        <div id="memoryView" class="hidden bg-white p-5 rounded-2xl shadow-md border border-slate-200 space-y-4">
            <div class="flex justify-between items-center">
                <h2 class="text-xl font-bold text-blue-800">🔍 Gedächtnis (Gegenstände):</h2>
                <button onclick="clearAllMemory()" class="bg-red-500 hover:bg-red-600 text-white px-2 py-1 rounded-lg text-xs font-semibold shadow">🗑️ Alles löschen</button>
            </div>
            <div id="categoryContainer" class="space-y-3 text-base">
                <!-- Kategorien werden hier dynamisch eingefügt -->
            </div>
        </div>

    </main>

    <!-- Fußbereich -->
    <footer class="bg-slate-200 text-center p-4 text-sm text-slate-600 flex justify-between items-center px-6">
        <span>Einfach bedienbare Web-App</span>
        <span>Version 4.2</span>
    </footer>

    <!-- JavaScript -->
    <script>
        const recordBtn = document.getElementById('recordBtn');
        const recordText = document.getElementById('recordText');
        const statusMessage = document.getElementById('statusMessage');
        const calendarList = document.getElementById('calendarList');
        const todoList = document.getElementById('todoList');
        const categoryContainer = document.getElementById('categoryContainer');
        const settingsBox = document.getElementById('settingsBox');
        const apiKeyInput = document.getElementById('apiKeyInput');
        const googleClientIdInput = document.getElementById('googleClientIdInput');
        const userNameInput = document.getElementById('userNameInput');
        const userNameDisplay = document.getElementById('userNameDisplay');
        const connectionStatus = document.getElementById('connectionStatus');
        
        const contactNameInput = document.getElementById('contactNameInput');
        const contactPhoneInput = document.getElementById('contactPhoneInput');
        const contactListDisplay = document.getElementById('contactListDisplay');

        const calendarView = document.getElementById('calendarView');
        const todoView = document.getElementById('todoView');
        const memoryView = document.getElementById('memoryView');
        const tabCalendarBtn = document.getElementById('tabCalendarBtn');
        const tabTodoBtn = document.getElementById('tabTodoBtn');
        const tabMemoryBtn = document.getElementById('tabMemoryBtn');

        let currentUserName = localStorage.getItem('user_custom_name') || "Silvia";
        userNameInput.value = currentUserName;
        updateUserGreeting();

        function updateUserGreeting() {
            userNameDisplay.textContent = `Hallo, ${currentUserName}!`;
        }

        function saveUserNameSetting() {
            const newName = userNameInput.value.trim();
            if (newName) {
                currentUserName = newName;
                localStorage.setItem('user_custom_name', currentUserName);
                updateUserGreeting();
                connectionStatus.textContent = `Name auf "${currentUserName}" geändert.`;
            } else {
                alert('Bitte gib einen Namen ein.');
            }
        }

        let calendarEntries = JSON.parse(localStorage.getItem('helfer_calendar_entries')) || [];
        let todoEntries = JSON.parse(localStorage.getItem('helfer_todo_entries')) || [];
        let memoryItems = JSON.parse(localStorage.getItem('helfer_memory')) || {};
        let savedContacts = JSON.parse(localStorage.getItem('helfer_contacts')) || {};

        renderAllLists();
        renderContactList();

        function saveContact() {
            const name = contactNameInput.value.trim();
            const phone = contactPhoneInput.value.trim();
            if (name && phone) {
                savedContacts[name.toLowerCase()] = { originalName: name, phone: phone };
                localStorage.setItem('helfer_contacts', JSON.stringify(savedContacts));
                contactNameInput.value = '';
                contactPhoneInput.value = '';
                renderContactList();
                connectionStatus.textContent = `Kontakt "${name}" gespeichert.`;
            } else {
                alert('Bitte Name und Telefonnummer eingeben.');
            }
        }

        function deleteContact(key) {
            delete savedContacts[key];
            localStorage.setItem('helfer_contacts', JSON.stringify(savedContacts));
            renderContactList();
        }

        function renderContactList() {
            const keys = Object.keys(savedContacts);
            if (keys.length === 0) {
                contactListDisplay.innerHTML = 'Keine Kontakte gespeichert.';
            } else {
                let html = '<b>Gespeicherte Kontakte:</b><br>';
                keys.forEach(k => {
                    html += `<div class="flex justify-between items-center my-1"><span>• ${savedContacts[k].originalName}: ${savedContacts[k].phone}</span> <button onclick="deleteContact('${k}')" class="text-red-600 font-bold ml-2">Löschen</button></div>`;
                });
                contactListDisplay.innerHTML = html;
            }
        }

        function switchTab(tab) {
            calendarView.classList.add('hidden');
            todoView.classList.add('hidden');
            memoryView.classList.add('hidden');
            tabCalendarBtn.className = "flex-1 py-2 rounded-lg font-bold text-sm text-slate-600 transition";
            tabTodoBtn.className = "flex-1 py-2 rounded-lg font-bold text-sm text-slate-600 transition";
            tabMemoryBtn.className = "py-2 px-3 rounded-lg font-bold text-xs text-slate-400 hover:text-slate-600 transition";

            if (tab === 'calendar') {
                calendarView.classList.remove('hidden');
                tabCalendarBtn.className = "flex-1 py-2 rounded-lg font-bold text-sm bg-white text-blue-800 shadow-sm transition";
            } else if (tab === 'todo') {
                todoView.classList.remove('hidden');
                tabTodoBtn.className = "flex-1 py-2 rounded-lg font-bold text-sm bg-white text-blue-800 shadow-sm transition";
            } else if (tab === 'memory') {
                memoryView.classList.remove('hidden');
                tabMemoryBtn.className = "py-2 px-3 rounded-lg font-bold text-xs bg-white text-blue-800 shadow-sm transition";
            }
        }

        const savedKey = localStorage.getItem('user_api_key');
        if (savedKey) apiKeyInput.value = savedKey;

        const savedClientId = localStorage.getItem('google_client_id') || "399573320370-qka01ghj0s88eoair7lla665cbj10o4g.apps.googleusercontent.com";
        googleClientIdInput.value = savedClientId;
        localStorage.setItem('google_client_id', savedClientId);

        let tokenClient;
        let accessToken = localStorage.getItem('google_access_token');

        function toggleSettings() {
            settingsBox.classList.toggle('hidden');
        }

        function saveApiKey() {
            const key = apiKeyInput.value.trim();
            if (key) {
                localStorage.setItem('user_api_key', key);
                connectionStatus.textContent = "Groq-Schlüssel gespeichert.";
            } else {
                alert('Bitte gib einen gültigen Schlüssel ein.');
            }
        }

        function saveGoogleClientId() {
            const clientId = googleClientIdInput.value.trim();
            if (clientId) {
                localStorage.setItem('google_client_id', clientId);
                connectionStatus.textContent = "Google Client-ID gespeichert.";
            } else {
                alert('Bitte gib eine Client-ID ein.');
            }
        }

        function loginWithGoogle() {
            const clientId = localStorage.getItem('google_client_id');
            if (!clientId) {
                alert('Bitte zuerst die Google Client-ID eintragen!');
                return;
            }

            try {
                tokenClient = google.accounts.oauth2.initTokenClient({
                    client_id: clientId,
                    scope: 'https://www.googleapis.com/auth/calendar.events',
                    callback: (response) => {
                        if (response.error) {
                            connectionStatus.textContent = `❌ Fehler: ${response.error}`;
                            return;
                        }
                        accessToken = response.access_token;
                        localStorage.setItem('google_access_token', accessToken);
                        connectionStatus.textContent = "✅ Mit Google Kalender verbunden!";
                    },
                });
                tokenClient.requestAccessToken();
            } catch (error) {
                connectionStatus.textContent = `❌ Fehler: ${error.message}`;
            }
        }

        function speak(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'de-DE';
                utterance.rate = 0.95;
                window.speechSynthesis.speak(utterance);
            }
        }

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition = null;
        let isRecording = false;

        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.lang = 'de-DE';
            recognition.interimResults = false;
            recognition.maxAlternatives = 1;

            recognition.onstart = function() {
                isRecording = true;
                statusMessage.textContent = "Höre zu... Bitte sprechen.";
                recordBtn.classList.remove('bg-red-600', 'hover:bg-red-700');
                recordBtn.classList.add('bg-emerald-600', 'hover:bg-emerald-700', 'animate-pulse');
                recordText.textContent = "HÖRE...";
            };

            recognition.onresult = function(event) {
                const speechResult = event.results[0][0].transcript;
                statusMessage.textContent = `Erkannt: "${speechResult}"`;
                
                const lower = speechResult.toLowerCase();
                
                if ((lower.includes("ruf") || lower.includes("anrufen")) && lower.includes("an")) {
                    handleCallCommand(lower);
                } else if (lower.includes("was steht heute an") || lower.includes("was liegt heute an") || lower.includes("bevor ich das haus verlasse")) {
                    triggerDailyBriefing();
                } else {
                    sendToGroqSmart(speechResult);
                }
            };

            recognition.onerror = function() {
                statusMessage.textContent = "Sprachfehler oder abgebrochen.";
                resetButton();
            };

            recognition.onend = function() {
                isRecording = false;
                resetButton();
            };
        } else {
            statusMessage.textContent = "Keine Spracherkennung im Browser.";
            recordBtn.disabled = true;
        }

        function handleCallCommand(text) {
            let foundContact = null;
            for (let key in savedContacts) {
                if (text.includes(key)) {
                    foundContact = savedContacts[key];
                    break;
                }
            }

            if (foundContact) {
                speak(`Ich rufe ${foundContact.originalName} für dich an.`);
                window.location.href = `tel:${foundContact.phone}`;
            } else {
                speak("Diesen Kontakt habe ich leider nicht gefunden. Du kannst ihn ganz einfach in den Einstellungen hinzufügen.");
            }
        }

        function toggleSpeechRecognition() {
            const currentKey = localStorage.getItem('user_api_key');
            if (!currentKey) {
                alert('Bitte hinterlege zuerst deinen Groq API-Key oben über "⚙️ Einstellungen"!');
                settingsBox.classList.remove('hidden');
                return;
            }

            if (!recognition) {
                alert('Spracherkennung wird vom Browser nicht unterstützt.');
                return;
            }

            if (isRecording) {
                recognition.stop();
            } else {
                try {
                    recognition.start();
                } catch (e) {
                    recognition.stop();
                    setTimeout(() => recognition.start(), 200);
                }
            }
        }

        function resetButton() {
            isRecording = false;
            recordBtn.classList.remove('bg-emerald-600', 'hover:bg-emerald-700', 'animate-pulse');
            recordBtn.classList.add('bg-red-600', 'hover:bg-red-700');
            recordText.textContent = "SPRECHEN";
        }

        async function triggerDailyBriefing() {
            statusMessage.textContent = "Lade Wetter & Briefing...";
            
            let weatherText = "";
            let weatherAdvice = "";
            try {
                const weatherRes = await fetch('https://api.open-meteo.com/v1/forecast?latitude=53.5135&longitude=10.4182&current=temperature_2m,weather_code,wind_speed_10m');
                if (weatherRes.ok) {
                    const weatherData = await weatherRes.json();
                    const temp = weatherData.current.temperature_2m;
                    const code = weatherData.current.weather_code;
                    const wind = weatherData.current.wind_speed_10m || 0;
                    
                    let condition = "bewölkt";
                    if (code === 0) condition = "klar und sonnig";
                    else if (code >= 1 && code <= 3) condition = "wechselhaft bewölkt";
                    else if (code >= 51 && code <= 67) condition = "regnerisch";
                    else if (code >= 71 && code <= 77) condition = "schneebedeckt";
                    else if (code >= 95) condition = "Gewitter";

                    weatherText = `Das aktuelle Wetter in Schwarzenbek ist ${condition} bei ${temp} Grad. `;

                    if (code >= 51 && code <= 67) {
                        weatherAdvice = "Es ist regnerisch, nimm bitte einen Regenschirm mit! ";
                    } else if (temp < 12) {
                        weatherAdvice = "Es ist ziemlich frisch draußen, zieh dir am besten eine Jacke an. ";
                    } else if (temp > 24) {
                        weatherAdvice = "Heute wird es schön warm! ";
                    } else if (wind > 30) {
                        weatherAdvice = "Es ist windig, nimm lieber eine Jacke mit. ";
                    } else {
                        weatherAdvice = "Das Wetter ist ganz angenehm. ";
                    }
                }
            } catch (e) {
                console.error("Wetterfehler:", e);
            }

            let briefingText = `Guten Tag, ${currentUserName}. Hier ist dein kurzer Überblick. ${weatherText} ${weatherAdvice}`;

            const todayStr = new Date().toISOString().split('T')[0];
            const todayCalendarEntries = calendarEntries.filter(e => {
                if (!e.isoDate) return true;
                return e.isoDate.startsWith(todayStr);
            });

            if (todayCalendarEntries.length > 0) {
                briefingText += "Deine Termine heute: ";
                todayCalendarEntries.forEach(e => {
                    briefingText += `${e.text}, am ${e.shortDate}. `;
                });
            }

            if (todoEntries.length > 0) {
                briefingText += "Offene To-Dos: ";
                todoEntries.forEach(e => {
                    briefingText += `${e.text}, `;
                });
            }

            const unimportantKeywords = ["kuscheltier", "spielzeug", "puppe", "teddy", "kuscheltiere"];
            const memKeys = Object.keys(memoryItems);
            let relevantItems = [];

            memKeys.forEach(k => {
                let itemObj = memoryItems[k];
                let loc = typeof itemObj === 'object' ? itemObj.location : itemObj;
                let isUnimportant = unimportantKeywords.some(badWord => k.toLowerCase().includes(badWord));
                if (!isUnimportant) {
                    relevantItems.push({ name: k, loc: loc });
                }
            });

            if (relevantItems.length > 0) {
                const humanPhrases = [
                    (art, name, loc) => `Ach ja, ${currentUserName}, denk dran: ${art} ${name} liegt ${loc}. `,
                    (art, name, loc) => `Vergiss nicht, ${art} ${name} einzupacken – das liegt ${loc}. `,
                    (art, name, loc) => `Möchtest du ${art} ${name} vielleicht mitnehmen? Die liegt ${loc}. `,
                    (art, name, loc) => `Und schau mal, ${art} ${name} liegt ${loc}, brauchst du die heute? `,
                    (art, name, loc) => `Hast du eigentlich ${art} ${name} eingepackt? Die liegt ja ${loc}. `,
                    (art, name, loc) => `Schau lieber noch mal kurz nach, ${art} ${name} liegt doch ${loc}. `,
                    (art, name, loc) => `Falls du sie brauchst: ${art} ${name} liegt drüben ${loc}. `,
                    (art, name, loc) => `Ach, übrigens: ${art} ${name} liegt noch ${loc}, falls du sie mitnehmen möchtest. `,
                    (art, name, loc) => `Nur ein kurzer Gedanke – denk an ${art} ${name}, die müsste ${loc} liegen. `,
                    (art, name, loc) => `Nicht dass du sie vergisst: ${art} ${name} liegt ${loc}. `
                ];

                relevantItems.forEach((item) => {
                    let art = "dein";
                    let lowerName = item.name.toLowerCase();
                    if (lowerName.endsWith('e') || lowerName.includes('brille') || lowerName.includes('tasche') || lowerName.includes('uhr')) {
                        art = "deine";
                    }
                    
                    let randomPhraseFunc = humanPhrases[Math.floor(Math.random() * humanPhrases.length)];
                    briefingText += randomPhraseFunc(art, item.name, item.loc);
                });
            }

            if (todayCalendarEntries.length === 0 && todoEntries.length === 0 && relevantItems.length === 0) {
                briefingText += "Es gibt heute keine besonderen Termine oder Gegenstände. ";
            }

            statusMessage.textContent = "Fertig.";
            speak(briefingText);
        }

        async function sendToGroqSmart(text) {
            const key = localStorage.getItem('user_api_key');
            statusMessage.textContent = "Verarbeite...";

            const now = new Date();
            const tomorrow = new Date(now);
            tomorrow.setDate(tomorrow.getDate() + 1);
            
            const todayStr = now.toISOString().split('T')[0];
            const tomorrowStr = tomorrow.toISOString().split('T')[0];

            const memoryWithDetails = {};
            for (let k in memoryItems) {
                let item = memoryItems[k];
                let loc = typeof item === 'object' ? item.location : item;
                let ts = typeof item === 'object' ? item.timestamp : now.getTime();
                
                let diffDays = Math.floor((now.getTime() - ts) / (1000 * 60 * 60 * 24));
                let timeDesc = diffDays === 0 ? "heute" : (diffDays === 1 ? "vor 1 Tag" : `vor ${diffDays} Tagen`);
                
                memoryWithDetails[k] = { location: loc, abgelegt: timeDesc };
            }
            const memoryContext = JSON.stringify(memoryWithDetails);
            const calendarContext = JSON.stringify(calendarEntries);
            const todoContext = JSON.stringify(todoEntries);

            try {
                const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${key}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        model: "openai/gpt-oss-120b",
                        response_format: { type: "json_object" },
                        messages: [
                            {
                                role: "system",
                                content: `Du bist ein hochpräziser, fehlerfreier und sprachlich eleganter deutscher Alltags-Assistent für ${currentUserName} in Schwarzenbek. 
                                Aktuelles Jahr ist 2026, heute ist ${todayStr} (${now.toLocaleDateString('de-DE', {weekday: 'long'})}), morgen ist ${tomorrowStr} (${tomorrow.toLocaleDateString('de-DE', {weekday: 'long'})}).
                                Bisheriges Gedächtnis über Gegenstände: ${memoryContext}
                                Aktuelle Kalender-Termine im System: ${calendarContext}
                                Aktuelle To-Dos im System: ${todoContext}
                                
                                ABSOLUTE REGELN FÜR FRAGEN ZU TERMINEN:
                                - Prüfe bei JEDER Frage nach Terminen ("heute", "morgen", "was habe ich vor", etc.) die Liste unter "Aktuelle Kalender-Termine im System".
                                - Vergleiche das Datum in der Frage mit dem "isoDate"-Wert in der Liste (Format YYYY-MM-DD). Fragt der Nutzer nach morgen, suche nach Einträgen, die mit ${tomorrowStr} beginnen.
                                - **ZWINGEND:** Wenn ein passender Termin in der Liste existiert, musst du ihn im Feld "reply" exakt nennen (Inhalt und Uhrzeit)! Sage NIEMALS, es sei kein Termin da, wenn einer in der Liste steht.
                                
                                ABSOLUTE REGELN FÜR TERMINE VS. TO-DOS:
                                - Wähle "calendar" NUR DANN, wenn der Nutzer explizit einen neuen Termin anlegt. Für Fragen oder Unterhaltungen nutze immer "chat".
                                
                                ABSOLUTE GRAMMATIK- UND FORMULIERUNGSGESETZE:
                                1. KEINE DOPPELTEN PRÄPOSITIONEN: Nutze niemals Konstruktionen wie "im in", "in der im" oder "auf dem in". Verwende immer korrekte deutsche Ortsangaben.
                                2. KORREKTE ARTIKEL FÜR GEGENSTÄNDE: Nutze zwingend immer das korrekte Geschlecht ("deine Brille", "dein Portemonnaie", "deine Tasche", "dein Handy", "dein Schlüssel").
                                3. SCHREIBWEISE VON "PORTMONNAIE": Schreibe es immer exakt als "Portemonnaie".
                                4. SPRACHLICHER STIL: Antworte extrem natürlich, freundlich, warmherzig und auf den Punkt.

                                Gib ein JSON-Objekt zurück mit:
                                - "type": string ("chat", "name_change", "item_store", "item_query", "note", "calendar")
                                - "new_name": string
                                - "item_name": string
                                - "item_location": string
                                - "item_category": string
                                - "note_text": string
                                - "summary": string
                                - "start_time": string
                                - "reply": string`
                            },
                            {
                                role: "user",
                                content: text
                            }
                        ]
                    })
                });

                if (!response.ok) throw new Error("API-Anfrage fehlgeschlagen");

                const data = await response.json();
                const aiData = JSON.parse(data.choices[0].message.content);

                let finalReply = aiData.reply;

                if (aiData.type === 'name_change' && aiData.new_name) {
                    currentUserName = aiData.new_name;
                    localStorage.setItem('user_custom_name', currentUserName);
                    userNameInput.value = currentUserName;
                    updateUserGreeting();
                    finalReply = `Sehr gerne, ${currentUserName}. Ab sofort nenne ich dich so.`;
                }

                if (aiData.type === 'item_store' && aiData.item_name && aiData.item_location) {
                    let cleanName = aiData.item_name.toLowerCase();
                    let cleanLoc = aiData.item_location;
                    
                    cleanLoc = cleanLoc.replace(/\b(im|in der|in dem|auf dem|auf der)\s+(in|im|in der|in dem)\b/gi, '$1');
                    cleanLoc = cleanLoc.replace(/in der flur schrank/gi, 'im Flurschrank');
                    cleanLoc = cleanLoc.replace(/in der flur/gi, 'im Flur');
                    
                    if (!cleanLoc.startsWith("im") && !cleanLoc.startsWith("in der") && !cleanLoc.startsWith("auf") && !cleanLoc.startsWith("unter") && !cleanLoc.startsWith("neben")) {
                        cleanLoc = "im " + cleanLoc;
                    }
                    let category = aiData.item_category || "Sonstiges";
                    
                    memoryItems[cleanName] = {
                        location: cleanLoc,
                        timestamp: Date.now(),
                        category: category
                    };
                    localStorage.setItem('helfer_memory', JSON.stringify(memoryItems));
                }

                if (aiData.type === 'item_query' && aiData.item_name) {
                    let cleanQuery = aiData.item_name.toLowerCase();
                    let foundItem = null;
                    let matchedName = aiData.item_name;

                    for (let storedKey in memoryItems) {
                        if (cleanQuery.includes(storedKey) || storedKey.includes(cleanQuery)) {
                            foundItem = memoryItems[storedKey];
                            matchedName = storedKey.charAt(0).toUpperCase() + storedKey.slice(1);
                            break;
                        }
                    }

                    if (foundItem) {
                        let art = "Dein";
                        let lowerStored = matchedName.toLowerCase();
                        if (lowerStored.endsWith('e') || lowerStored.includes('brille') || lowerStored.includes('tasche')) {
                            art = "Deine";
                        }
                        
                        let diffDays = Math.floor((Date.now() - foundItem.timestamp) / (1000 * 60 * 60 * 24));
                        let timeString = diffDays === 0 ? "heute" : (diffDays === 1 ? "vor 1 Tag" : `vor ${diffDays} Tagen`);
                        
                        finalReply = `${art} ${matchedName} liegt ${foundItem.location}. Das hast du ${timeString} dort abgelegt.`;
                    } else {
                        let art = "dein";
                        let lowerAi = aiData.item_name.toLowerCase();
                        if (lowerAi.endsWith('e') || lowerAi.includes('brille') || lowerAi.includes('tasche')) {
                            art = "deine";
                        }
                        finalReply = `Dazu habe ich keinen Eintrag, wo ${art} ${aiData.item_name} liegen könnte.`;
                    }
                }

                statusMessage.textContent = "Fertig.";
                speak(finalReply);

                if (aiData.type === 'calendar') {
                    let calendarEventId = null;
                    let fullFormattedDate = new Date().toLocaleString('de-DE', { dateStyle: 'medium', timeStyle: 'short' });
                    let shortFormattedDate = new Date().toLocaleDateString('de-DE', { day: 'numeric', month: 'long' });
                    let rawIsoTime = aiData.start_time || new Date().toISOString();
                    
                    if (aiData.start_time) {
                        calendarEventId = await createGoogleCalendarEvent(aiData.summary || text, aiData.start_time);
                        const parsedDate = new Date(aiData.start_time);
                        if (!isNaN(parsedDate)) {
                            fullFormattedDate = parsedDate.toLocaleString('de-DE', { dateStyle: 'medium', timeStyle: 'short' });
                            let timePart = parsedDate.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
                            let datePart = parsedDate.toLocaleDateString('de-DE', { day: 'numeric', month: 'long' });
                            shortFormattedDate = `${datePart} um ${timePart} Uhr`;
                        }
                    }

                    const newCalEntry = {
                        id: Date.now(),
                        calendarId: calendarEventId,
                        text: aiData.summary || text,
                        date: fullFormattedDate,
                        shortDate: shortFormattedDate,
                        isoDate: rawIsoTime
                    };
                    calendarEntries.unshift(newCalEntry);
                    localStorage.setItem('helfer_calendar_entries', JSON.stringify(calendarEntries));
                } else if (aiData.type === 'note') {
                    const newTodoEntry = {
                        id: Date.now(),
                        text: aiData.note_text || text,
                        date: new Date().toLocaleDateString('de-DE', { hour: '2-digit', minute: '2-digit' })
                    };
                    todoEntries.unshift(newTodoEntry);
                    localStorage.setItem('helfer_todo_entries', JSON.stringify(todoEntries));
                }

                renderAllLists();

            } catch (error) {
                statusMessage.textContent = "❌ Fehler bei der Verarbeitung.";
                speak(`Es ist ein Fehler aufgetreten.`);
                console.error(error);
            }
        }

        async function createGoogleCalendarEvent(summary, startTimeStr) {
            if (!accessToken) return null;

            const startDate = new Date(startTimeStr);
            const endDate = new Date(startDate.getTime() + 60 * 60 * 1000);

            const event = {
                summary: summary,
                start: { dateTime: startDate.toISOString() },
                end: { dateTime: endDate.toISOString() },
                reminders: {
                    useDefault: false,
                    overrides: [
                        { method: 'popup', minutes: 120 },
                        { method: 'email', minutes: 120 }
                    ]
                }
            };

            try {
                const res = await fetch('https://www.googleapis.com/calendar/v3/calendars/primary/events', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${accessToken}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(event)
                });

                if (res.ok) {
                    const data = await res.json();
                    return data.id;
                }
            } catch (e) {
                console.error(e);
            }
            return null;
        }

        async function deleteCalendarEntry(id, calendarId) {
            if (calendarId && calendarId !== 'null' && calendarId !== 'undefined' && accessToken) {
                try {
                    await fetch(`https://www.googleapis.com/calendar/v3/calendars/primary/events/${calendarId}`, {
                        method: 'DELETE',
                        headers: { 'Authorization': `Bearer ${accessToken}` }
                    });
                } catch (e) {
                    console.error("Fehler beim Löschen im Google Kalender:", e);
                }
            }

            calendarEntries = calendarEntries.filter(e => e.id !== id);
            localStorage.setItem('helfer_calendar_entries', JSON.stringify(calendarEntries));
            renderAllLists();
            speak("Termin gelöscht.");
        }

        function deleteTodoEntry(id) {
            todoEntries = todoEntries.filter(e => e.id !== id);
            localStorage.setItem('helfer_todo_entries', JSON.stringify(todoEntries));
            renderAllLists();
            speak("Erledigt.");
        }

        function deleteMemoryItem(key) {
            delete memoryItems[key];
            localStorage.setItem('helfer_memory', JSON.stringify(memoryItems));
            renderAllLists();
            speak("Gelöscht.");
        }

        function clearAllMemory() {
            memoryItems = {};
            localStorage.removeItem('helfer_memory');
            renderAllLists();
            speak("Gedächtnis geleert.");
        }

        function renderAllLists() {
            if (calendarEntries.length === 0) {
                calendarList.innerHTML = '<li class="text-slate-500">Keine Termine eingetragen.</li>';
            } else {
                calendarList.innerHTML = '';
                calendarEntries.forEach(entry => {
                    const li = document.createElement('li');
                    li.className = "bg-slate-50 p-3 rounded-xl border border-slate-100 flex justify-between items-center text-base";
                    li.innerHTML = `
                        <div>
                            <span>📅 ${entry.text}</span>
                            <div class="text-xs text-slate-400">${entry.date}</div>
                        </div>
                        <button onclick="deleteCalendarEntry(${entry.id}, '${entry.calendarId || ''}')" class="bg-red-500 hover:bg-red-600 text-white px-3 py-1 rounded-lg text-sm font-semibold ml-2">
                            Löschen
                        </button>
                    `;
                    calendarList.appendChild(li);
                });
            }

            if (todoEntries.length === 0) {
                todoList.innerHTML = '<li class="text-slate-500">Keine offenen To-Dos.</li>';
            } else {
                todoList.innerHTML = '';
                todoEntries.forEach(entry => {
                    const li = document.createElement('li');
                    li.className = "bg-slate-50 p-3 rounded-xl border border-slate-100 flex justify-between items-center text-base";
                    li.innerHTML = `
                        <div>
                            <span>📝 ${entry.text}</span>
                            <div class="text-xs text-slate-400">${entry.date}</div>
                        </div>
                        <button onclick="deleteTodoEntry(${entry.id})" class="bg-emerald-500 hover:bg-emerald-600 text-white px-3 py-1 rounded-lg text-sm font-semibold ml-2">
                            Erledigt
                        </button>
                    `;
                    todoList.appendChild(li);
                });
            }

            const categories = ["Flur", "Schlafzimmer", "Wohnzimmer", "Badezimmer", "Sonstiges"];
            const grouped = {};
            categories.forEach(c => grouped[c] = []);

            for (let key in memoryItems) {
                let item = memoryItems[key];
                let loc = typeof item === 'object' ? item.location : item;
                let cat = (typeof item === 'object' && item.category) ? item.category : "Sonstiges";
                if (!grouped[cat]) cat = "Sonstiges";
                
                grouped[cat].push({ key: key, location: loc });
            }

            let catHtml = '';
            let hasAnyItems = false;

            categories.forEach(cat => {
                let itemsInCat = grouped[cat];
                if (itemsInCat.length > 0) {
                    hasAnyItems = true;
                    catHtml += `<div class="border border-slate-200 rounded-xl p-3 bg-slate-50">
                        <h3 class="font-bold text-blue-700 mb-2">📌 ${cat}</h3>
                        <ul class="space-y-1">`;
                    
                    itemsInCat.forEach(i => {
                        let capitalizedName = i.key.charAt(0).toUpperCase() + i.key.slice(1);
                        catHtml += `<li class="flex justify-between items-center text-sm py-1 border-b border-slate-200 last:border-none">
                            <span>• <b>${capitalizedName}</b>: ${i.location}</span>
                            <button onclick="deleteMemoryItem('${i.key}')" class="text-red-600 font-bold text-xs ml-2">Löschen</button>
                        </li>`;
                    });

                    catHtml += `</ul></div>`;
                }
            });

            if (!hasAnyItems) {
                categoryContainer.innerHTML = '<p class="text-slate-500">Keine Gegenstände gespeichert.</p>';
            } else {
                categoryContainer.innerHTML = catHtml;
            }
        }
    </script>
</body>
