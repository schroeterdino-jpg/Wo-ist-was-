<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Passwort & Kalender Assistent</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #fdfcf7;
            margin: 0;
            padding: 15px;
            color: #333;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
        }
        .card {
            background: #ffffff;
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .credential-row {
            font-size: 14px;
            word-break: break-all;
            line-height: 1.5;
        }
        .btn-calendar {
            background-color: #2e7d32;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px;
            width: 100%;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 15px;
        }
        .btn-speak {
            background-color: #d32f2f;
            color: white;
            border: none;
            border-radius: 50px;
            width: 100px;
            height: 100px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            display: block;
            margin: 20px auto;
            box-shadow: 0 4px 10px rgba(211,47,47,0.3);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Gespeicherte Passwörter Sektion -->
        <div class="card">
            <h3>📌 Passwörter</h3>
            <div id="credential-list">
                <!-- Wird dynamisch oder direkt sauber in einer Reihe ausgegeben -->
                <div class="credential-row" id="entry-netflix">
                    <strong>Netflix:</strong> <br>
                    <span id="display-cred">Benutzer: schroeterdino@googlemail.com &nbsp;|&nbsp; Passwort: D.s28093001984</span>
                </div>
            </div>
        </div>

        <!-- Google Kalender Button -->
        <button class="btn-calendar" onclick="addToGoogleCalendar()">📅 Mit Google Kalender verbinden</button>

        <!-- Sprach-Button -->
        <button class="btn-speak" onclick="startVoiceInput()">SPRECHEN</button>
    </div>

    <script>
        // Funktion zum Bereinigen von Leerzeichen, die durch die Spracherkennung entstehen
        function cleanInput(text) {
            if (!text) return '';
            // Entfernt alle unerwünschten Leerzeichen innerhalb des Strings
            return text.replace(/\s+/g, '');
        }

        // Funktion zum Formatieren und Speichern von Zugangsdaten in einer sauberen Reihe
        function saveCredential(service, username, password) {
            const cleanUser = cleanInput(username).toLowerCase();
            const cleanPass = cleanInput(password);

            const displayElement = document.getElementById('display-cred');
            if (displayElement) {
                displayElement.innerHTML = `Benutzer: ${cleanUser} &nbsp;|&nbsp; Passwort: ${cleanPass}`;
            }
        }

        // Google Kalender Integration
        function addToGoogleCalendar() {
            const title = encodeURIComponent("Netflix Zugangsdaten gesichert");
            const details = encodeURIComponent(document.getElementById('display-cred').innerText);
            
            // Aktuelles Datum als Standard für den Kalendereintrag
            const now = new Date();
            const startIso = now.toISOString().replace(/-|:|\.\d+/g, '');
            const endIso = new Date(now.getTime() + 3600000).toISOString().replace(/-|:|\.\d+/g, '');
            
            const calendarUrl = `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${title}&details=${details}&dates=${startIso}/${endIso}`;
            window.open(calendarUrl, '_blank');
        }

        // Platzhalter für die Sprachsteuerung
        function startVoiceInput() {
            alert("Sprachsteuerung aktiv. Bitte diktieren...");
            // Hier greift deine bestehende Spracherkennungs-Logik
        }
    </script>
</body>
</html>
